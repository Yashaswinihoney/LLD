<!-- ====== SECTION 7: CONCURRENCY — CORE ====== -->

<text x="400" y="1237" text-anchor="middle" font-size="11" font-weight="600" fill="#888">— concurrency safety (Req 5 + 6) — the hardest part —</text>

<rect x="30" y="1252" width="740" height="148" rx="8" fill="#faece7" stroke="#993c1d"/>
<text x="400" y="1274" text-anchor="middle" font-size="13" font-weight="700" fill="#712b13">Problem: 500 students try to register for CS-301 (capacity=30) at 9:00 AM</text>

<!-- problem scenario -->
<text x="400" y="1294" text-anchor="middle" font-size="11" fill="#993c1d">Without locking: Thread A reads count=29 → Thread B reads count=29 →</text>
<text x="400" y="1310" text-anchor="middle" font-size="11" fill="#993c1d">Both see "29 &lt; 30" → Both enroll → count becomes 31 → OVER-ENROLLED ❌</text>

<!-- solution -->
<text x="400" y="1334" text-anchor="middle" font-size="12" font-weight="700" fill="#712b13">Solution: Redis distributed lock (SET NX) per courseCode</text>
<text x="400" y="1352" text-anchor="middle" font-size="11" fill="#993c1d">SET lock:CS-301 "server-1" NX PX 5000  →  only ONE server holds the lock at a time</text>
<text x="400" y="1368" text-anchor="middle" font-size="11" fill="#993c1d">All 500 requests queue at the lock → served in FIFO order → exactly 30 enrolled, rest waitlisted</text>
<text x="400" y="1384" text-anchor="middle" font-size="11" fill="#993c1d">Lock released immediately after DB write + cache update (~5ms) → high throughput preserved</text>

<!-- ====== SECTION 13: REQUIREMENTS MAP ====== -->
<line x1="30" y1="2608" x2="770" y2="2608" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
<text x="400" y="2601" text-anchor="middle" font-size="11" font-weight="600" fill="#888">— all 7 requirements → design decisions —</text>

<rect x="30" y="2616" width="740" height="48" rx="8" fill="#e1f5ee" stroke="#0f6e56"/>
<text x="400" y="2636" text-anchor="middle" font-size="12" font-weight="700" fill="#085041">Req 1: Students register + view courses</text>
<text x="400" y="2652" text-anchor="middle" font-size="11" fill="#0f6e56">POST /enrollments to register. GET /students/{id}/enrollments to view schedule. Enrollment records in PostgreSQL. Active enrollments cached in Redis per student.</text>

<rect x="30" y="2676" width="740" height="48" rx="8" fill="#e6f1fb" stroke="#185fa5"/>
<text x="400" y="2696" text-anchor="middle" font-size="12" font-weight="700" fill="#0c447c">Req 2: Course has code, name, instructor, max capacity</text>
<text x="400" y="2712" text-anchor="middle" font-size="11" fill="#185fa5">Stored in PostgreSQL courses table. Synced to Elasticsearch for search. Seat count in Redis (seat:{courseCode}) for real-time availability — updated atomically on each enrollment.</text>

<rect x="30" y="2736" width="740" height="48" rx="8" fill="#faeeda" stroke="#ba7517"/>
<text x="400" y="2756" text-anchor="middle" font-size="12" font-weight="700" fill="#633806">Req 3: Search by code / name</text>
<text x="400" y="2772" text-anchor="middle" font-size="11" fill="#854f0b">Code search: Redis hash O(1) lookup, cache miss → PostgreSQL exact match. Name search: Elasticsearch full-text with partial match + typo tolerance. Both cache results in Redis TTL=5min.</text>

<rect x="30" y="2796" width="740" height="48" rx="8" fill="#eedefe" stroke="#7f77dd"/>
<text x="400" y="2816" text-anchor="middle" font-size="12" font-weight="700" fill="#3c3489">Req 4: Prevent over-enrollment (capacity enforcement)</text>
<text x="400" y="2832" text-anchor="middle" font-size="11" fill="#534ab7">Redis DECR seat:{code} — atomic, returns new value. If value &lt; 0: INCR back (undo) → WAITLIST. PostgreSQL enrollment count as source-of-truth. Redis as fast gate.</text>

<rect x="30" y="2856" width="740" height="48" rx="8" fill="#faece7" stroke="#993c1d"/>
<text x="400" y="2876" text-anchor="middle" font-size="12" font-weight="700" fill="#712b13">Req 5 + 6: Concurrent requests + data consistency + no race conditions</text>
<text x="400" y="2892" text-anchor="middle" font-size="11" fill="#993c1d">Redis SET NX distributed lock per courseCode (TTL=5s). PostgreSQL SELECT FOR UPDATE inside transaction. FIFO fair=true ReentrantLock in-process. All three layers prevent any race condition.</text>

<rect x="30" y="2916" width="740" height="48" rx="8" fill="#e1f5ee" stroke="#0f6e56"/>
<text x="400" y="2936" text-anchor="middle" font-size="12" font-weight="700" fill="#085041">Req 7: Extensible design</text>
<text x="400" y="2952" text-anchor="middle" font-size="11" fill="#0f6e56">Strategy pattern: add new enrollment rules (priority for seniors, prerequisites) without touching Registration Service. Observer pattern: add new notification channels (push, WhatsApp) without changing Enrollment flow. Factory: add new course types (blended, workshop) in one class.</text>

<!-- FINAL -->
<rect x="30" y="2976" width="740" height="60" rx="8" fill="#2c2c2a"/>
<text x="400" y="2998" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">The hardest problem: 1000 students all hit "Register" for CS-101 the moment registration opens.</text>
<text x="400" y="3018" text-anchor="middle" font-size="11" fill="#aaa">Redis SET NX per course (atomic lock) + DECR seat counter (atomic operation) + PostgreSQL transaction = exactly max-capacity enrolled, rest waitlisted, zero double-enrollment.</text>
