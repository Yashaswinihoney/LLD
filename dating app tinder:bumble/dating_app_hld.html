<text x="400" y="586" text-anchor="middle" font-size="13" font-weight="700" fill="#0c447c">Profile Setup — 7 Steps</text>

<rect x="50" y="596" width="22" height="22" rx="11" fill="#185fa5"/>
<text x="61" y="611" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">1</text>
<text x="83" y="611" font-size="10" fill="#0c447c"> User signs up (phone/Google OAuth) → Profile Service creates user record in PostgreSQL, sets status=INCOMPLETE</text>

<rect x="50" y="622" width="22" height="22" rx="11" fill="#185fa5"/>
<text x="61" y="637" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">2</text>
<text x="83" y="637" font-size="10" fill="#0c447c"> User fills: name, age, bio, gender, orientation, preferences (age range, max distance, gender sought)</text>

<rect x="50" y="648" width="22" height="22" rx="11" fill="#185fa5"/>
<text x="61" y="663" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">3</text>
<text x="83" y="663" font-size="10" fill="#0c447c"> Photo upload: client → REST PUT /photos → Photo Service → S3 (original). Async: ML pipeline triggered.</text>

<rect x="50" y="674" width="22" height="22" rx="11" fill="#185fa5"/>
<text x="61" y="689" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">4</text>
<text x="83" y="689" font-size="10" fill="#0c447c"> ML Photo Pipeline (async): face-detect (must contain face) → NSFW filter → generate 3 CDN variants (thumbnail 150px, card 400px, full 800px)</text>

<rect x="50" y="700" width="22" height="22" rx="11" fill="#185fa5"/>
<text x="61" y="715" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">5</text>
<text x="83" y="715" font-size="10" fill="#0c447c"> Photo approved → stored in CDN, URL written back to PostgreSQL. User must have ≥1 approved photo to go active.</text>

<rect x="50" y="726" width="22" height="22" rx="11" fill="#185fa5"/>
<text x="61" y="741" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">6</text>
<text x="83" y="741" font-size="10" fill="#0c447c"> Location shared → GEOADD active_users:{city} {lat} {lng} {userId}. Profile status=ACTIVE. ELO score initialised = 1000.</text>

<rect x="50" y="752" width="22" height="22" rx="11" fill="#185fa5"/>
<text x="61" y="767" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">7</text>
<text x="83" y="767" font-size="10" fill="#0c447c"> Profile indexed in Elasticsearch (age, city, gender, orientation) for fast discovery filtering. Card stack pre-built.</text>

<line x1="400" y1="744" x2="400" y2="792" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

<!-- ====== SECTION 5: DISCOVERY — THE ELO ENGINE ====== -->
<line x1="30" y1="780" x2="770" y2="780" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
<text x="400" y="774" text-anchor="middle" font-size="11" font-weight="600" fill="#888">— discovery engine: who do you show me and in what order? —</text>

<rect x="30" y="792" width="740" height="72" rx="8" fill="#faece7" stroke="#993c1d"/>
<text x="400" y="814" text-anchor="middle" font-size="13" font-weight="700" fill="#712b13">The core product problem: show me people I am likely to like, and who are likely to like me back</text>
<text x="400" y="834" text-anchor="middle" font-size="11" fill="#993c1d">Showing irrelevant profiles wastes the user's 100 free swipes. Showing profiles I'll never match with is demoralising.</text>
<text x="400" y="850" text-anchor="middle" font-size="11" fill="#993c1d">Tinder solved this with ELO (desirability score). Bumble adds recency and engagement signals on top.</text>

<line x1="400" y1="864" x2="400" y2="904" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

<!-- ELO Inputs -->
<rect x="30" y="904" width="740" height="52" rx="8" fill="#2c2c2a"/>
<text x="400" y="924" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Discovery Engine — Candidate Scoring Pipeline</text>
<text x="400" y="942" text-anchor="middle" font-size="11" fill="#aaa">Every candidate in your geo+preference window is scored. Top-K are your card stack. Rebuilt every N swipes.</text>

<line x1="400" y1="956" x2="400" y2="988" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Four inputs in 2x2 grid -->
<rect x="20"  y="988" width="370" height="88" rx="8" fill="#faeeda" stroke="#ba7517"/>
<text x="205" y="1010" text-anchor="middle" font-size="12" font-weight="700" fill="#633806">Signal 1: ELO Desirability Score</text>
<text x="205" y="1028" text-anchor="middle" font-size="11" fill="#854f0b">Each user has a score 0–3000. Updated on every right swipe (score ↑) and left swipe (score ↓).</text>
<text x="205" y="1044" text-anchor="middle" font-size="11" fill="#854f0b">Weighted by the swiper's own score — liked by a high-score user = bigger gain.</text>
<text x="205" y="1060" text-anchor="middle" font-size="11" fill="#854f0b">You are shown primarily to users with similar ELO ± 200 pts. Like-attracts-like clustering.</text>

<rect x="410" y="988" width="370" height="88" rx="8" fill="#faeeda" stroke="#ba7517"/>
<text x="595" y="1010" text-anchor="middle" font-size="12" font-weight="700" fill="#633806">Signal 2: Geo + Hard Filters</text>
<text x="595" y="1028" text-anchor="middle" font-size="11" fill="#854f0b">GEORADIUS active_users:{city} {myLat} {myLng} {maxDist}km → candidate list.</text>
<text x="595" y="1044" text-anchor="middle" font-size="11" fill="#854f0b">Hard filter: age in [minAge, maxAge], gender/orientation match, not already swiped.</text>
<text x="595" y="1060" text-anchor="middle" font-size="11" fill="#854f0b">Already-swiped users excluded via Redis SET: swiped:{myId} (Bloom filter at scale).</text>

<rect x="20"  y="1084" width="370" height="88" rx="8" fill="#eedefe" stroke="#7f77dd"/>
<text x="205" y="1106" text-anchor="middle" font-size="12" font-weight="700" fill="#3c3489">Signal 3: Recency + Activity</text>
<text x="205" y="1124" text-anchor="middle" font-size="11" fill="#534ab7">Last-active timestamp multiplier: active in last hour → 2×, last day → 1×, last week → 0.5×.</text>
<text x="205" y="1140" text-anchor="middle" font-size="11" fill="#534ab7">New users get a "new member boost": inflated in candidate queues for first 24hrs.</text>
<text x="205" y="1156" text-anchor="middle" font-size="11" fill="#534ab7">Boosts (paid feature) → 1hr of inflated placement. Temporarily 10× normal visibility.</text>

<rect x="410" y="1084" width="370" height="88" rx="8" fill="#eedefe" stroke="#7f77dd"/>
<text x="595" y="1106" text-anchor="middle" font-size="12" font-weight="700" fill="#3c3489">Signal 4: Collaborative Filtering</text>
<text x="595" y="1124" text-anchor="middle" font-size="11" fill="#534ab7">Users similar to you (liked same profiles) who liked X → X is ranked higher for you.</text>
<text x="595" y="1140" text-anchor="middle" font-size="11" fill="#534ab7">Photo attractiveness ML score (trained on swipe outcomes per photo) — boosts card order.</text>
<text x="595" y="1156" text-anchor="middle" font-size="11" fill="#534ab7">Mutual preference signals: X swiped your profile before you → shown near top of your stack.</text>

<line x1="205" y1="1172" x2="360" y2="1216" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="595" y1="1172" x2="440" y2="1216" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Card stack output -->
<rect x="160" y="1216" width="480" height="68" rx="8" fill="#eaf3de" stroke="#3b6d11"/>
<text x="400" y="1238" text-anchor="middle" font-size="13" font-weight="700" fill="#27500a">Card Stack: Top-K Candidates (K=50), ranked and cached</text>
<text x="400" y="1256" text-anchor="middle" font-size="11" fill="#3b6d11">Stored in Redis: deck:{userId} (LIST of userIds, ordered by score). Pre-fetched so first swipe is instant.</text>
<text x="400" y="1272" text-anchor="middle" font-size="11" fill="#3b6d11">Client pre-loads next 10 cards in background. Deck rebuilt when &lt;5 cards remain.</text>

<line x1="400" y1="1284" x2="400" y2="1324" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

<!-- ====== SECTION 6: SWIPE FLOW + ATOMIC MATCH DETECTION ====== -->
<line x1="30" y1="1312" x2="770" y2="1312" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
<text x="400" y="1306" text-anchor="middle" font-size="11" font-weight="600" fill="#888">— swipe flow + atomic match detection: the most critical piece —</text>

<rect x="30" y="1324" width="740" height="52" rx="6" fill="#eedefe" stroke="#7f77dd"/>
<text x="400" y="1344" text-anchor="middle" font-size="12" font-weight="700" fill="#3c3489">POST /api/swipe  { targetUserId, direction: "like"|"pass", isSuper: false }</text>
<text x="400" y="1360" text-anchor="middle" font-size="11" fill="#534ab7">Swipe Service receives → validates rate limit (swipes/day for free users)</text>

<line x1="400" y1="1376" x2="400" y2="1412" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="80" y="1412" width="640" height="220" rx="8" fill="#e1f5ee" stroke="#0f6e56"/>
<text x="400" y="1434" text-anchor="middle" font-size="13" font-weight="700" fill="#085041">Swipe Service — 8 Steps (Left Swipe vs Right Swipe)</text>

<rect x="100" y="1444" width="22" height="22" rx="11" fill="#0f6e56"/>
<text x="111" y="1459" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">1</text>
<text x="133" y="1459" font-size="10" fill="#085041"> Check daily swipe limit: Redis INCR swipes:{userId}:{date}. Free user at 100 → 429 "Buy Premium to swipe more".</text>

<rect x="100" y="1470" width="22" height="22" rx="11" fill="#0f6e56"/>
<text x="111" y="1485" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">2</text>
<text x="133" y="1485" font-size="10" fill="#085041"> Record swipe in Redis: SADD swiped:{myId} {targetId} — so target never appears again in my deck.</text>

<rect x="100" y="1496" width="22" height="22" rx="11" fill="#0f6e56"/>
<text x="111" y="1511" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">3</text>
<text x="133" y="1511" font-size="10" fill="#085041"> Persist swipe event asynchronously to PostgreSQL swipes table (userId, targetId, direction, ts).</text>

<rect x="100" y="1522" width="22" height="22" rx="11" fill="#0f6e56"/>
<text x="111" y="1537" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">4</text>
<text x="133" y="1537" font-size="10" fill="#085041"> LEFT SWIPE (pass): update ELO. target.eloScore -= ΔeloDelta(myElo). Publish analytics event. Done.</text>

<rect x="100" y="1548" width="22" height="22" rx="11" fill="#1a8f5c"/>
<text x="111" y="1563" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">5</text>
<text x="133" y="1563" font-size="10" fill="#085041"> RIGHT SWIPE: check for mutual like — Redis SISMEMBER likes:{targetId} {myId}. O(1) lookup. Did they like me first?</text>

<rect x="100" y="1574" width="22" height="22" rx="11" fill="#0f6e56"/>
<text x="111" y="1589" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">6</text>
<text x="133" y="1589" font-size="10" fill="#085041"> NO mutual like: SADD likes:{myId} {targetId}. Update ELO (target.score ↑). Return { matched: false }. Done.</text>

<rect x="100" y="1600" width="22" height="22" rx="11" fill="#d85a30"/>
<text x="111" y="1615" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">7</text>
<text x="133" y="1615" font-size="10" fill="#085041"> MUTUAL MATCH: create match record in PostgreSQL. SREM likes:{targetId} {myId} (cleanup). Open chat channel.</text>

<rect x="100" y="1626" width="22" height="22" rx="11" fill="#d85a30"/>
<text x="111" y="1641" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">8</text>
<text x="133" y="1641" font-size="10" fill="#085041"> Publish match-event to Kafka → Notification Service: push to both users. Bumble: start 24hr timer for woman to message.</text>

<!-- match/no-match fork -->

<line x1="400" y1="1632" x2="560" y2="1672" stroke="#d85a30" stroke-width="1" marker-end="url(#arrow-r)"/>

<!-- ====== SECTION 7: ATOMIC MATCH RACE CONDITION ====== -->
<line x1="30" y1="1748" x2="770" y2="1748" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
<text x="400" y="1742" text-anchor="middle" font-size="11" font-weight="600" fill="#888">— critical: preventing a double-match from two simultaneous right-swipes —</text>

<rect x="30" y="1760" width="740" height="140" rx="8" fill="#faece7" stroke="#993c1d"/>
<text x="400" y="1782" text-anchor="middle" font-size="13" font-weight="700" fill="#712b13">Problem: Alice swipes right on Bob, Bob swipes right on Alice — AT THE SAME MILLISECOND</text>
<text x="400" y="1802" text-anchor="middle" font-size="11" fill="#993c1d">Step 5 for Alice: SISMEMBER likes:Bob {Alice} → 0 (Bob hasn't liked yet) → SADD likes:Alice {Bob}</text>
<text x="400" y="1818" text-anchor="middle" font-size="11" fill="#993c1d">Step 5 for Bob:  SISMEMBER likes:Alice {Bob} → 0 (Alice's SADD may not have run yet) → SADD likes:Bob {Alice}</text>
<text x="400" y="1834" text-anchor="middle" font-size="11" fill="#993c1d">Both see "no mutual match". Neither match fires. Both likes sit in Redis forever. ❌</text>

<text x="400" y="1858" text-anchor="middle" font-size="12" font-weight="700" fill="#712b13">Solution: atomic check-and-set with Redis Lua or GETSET</text>
<text x="400" y="1878" text-anchor="middle" font-size="11" fill="#993c1d">Lua script: GETSET likes:{minId}:{maxId} = "1" — if old value was already "1" → match. Atomic, single-threaded in Redis.</text>
<text x="400" y="1894" text-anchor="middle" font-size="11" fill="#993c1d">Key: min(aliceId, bobId):max(aliceId, bobId) — canonical key regardless of who swipes first. Guaranteed exactly-once match.</text>

<line x1="400" y1="1900" x2="400" y2="1940" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

<!-- ====== SECTION 8: CHAT FLOW ====== -->
<line x1="30" y1="1928" x2="770" y2="1928" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
<text x="400" y="1922" text-anchor="middle" font-size="11" font-weight="600" fill="#888">— chat flow: messaging between matched users (same architecture as WhatsApp/Slack) —</text>

<rect x="40" y="1940" width="720" height="148" rx="8" fill="#eedefe" stroke="#7f77dd"/>
<text x="400" y="1962" text-anchor="middle" font-size="13" font-weight="700" fill="#3c3489">Chat Service — WebSocket Messaging</text>
<text x="400" y="1982" text-anchor="middle" font-size="11" fill="#534ab7">1. Match created → chat channel opened. Both users connect via WebSocket on next app open.</text>
<text x="400" y="1998" text-anchor="middle" font-size="11" fill="#534ab7">2. Message sent: WS frame → Chat Service → validate sender is part of this match → persist to Cassandra.</text>
<text x="400" y="2014" text-anchor="middle" font-size="11" fill="#534ab7">3. ACK to sender. Publish to Kafka: chat-messages topic → Fan-out Service → push to receiver's WS.</text>
<text x="400" y="2030" text-anchor="middle" font-size="11" fill="#534ab7">4. Receiver offline: FCM/APNs push notification → "You have a new message from your match!".</text>
<text x="400" y="2046" text-anchor="middle" font-size="11" fill="#534ab7">5. Bumble-specific: if match is hetero and no message from woman in 24hr → match auto-expires. Cron job checks Redis TTL.</text>
<text x="400" y="2062" text-anchor="middle" font-size="11" fill="#534ab7">6. Unmatch: match status = UNMATCHED. Chat channel closed. Messages retained (for safety reports) but hidden from UI.</text>
<text x="400" y="2078" text-anchor="middle" font-size="10" font-weight="600" fill="#3c3489">Gifted messages (paid): bypass unmatch — allows one message even after being unmatched (controversial, Bumble-specific)</text>

<!-- ====== SECTION 13: REQUIREMENTS MAP ====== -->
<line x1="30" y1="2880" x2="770" y2="2880" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
<text x="400" y="2874" text-anchor="middle" font-size="11" font-weight="600" fill="#888">— core requirements → design decisions —</text>

<rect x="30" y="2888" width="740" height="52" rx="8" fill="#e1f5ee" stroke="#0f6e56"/>
<text x="400" y="2908" text-anchor="middle" font-size="12" font-weight="700" fill="#085041">Show me people I'm likely to like — not random profiles</text>
<text x="400" y="2926" text-anchor="middle" font-size="11" fill="#0f6e56">ELO score clusters users by revealed preference (who likes who). Geo + hard filters narrow the candidate pool. Collaborative filtering adds "people like you also liked X". Card stack pre-built and cached — first swipe is always instant.</text>

<rect x="30" y="2948" width="740" height="52" rx="8" fill="#e6f1fb" stroke="#185fa5"/>
<text x="400" y="2968" text-anchor="middle" font-size="12" font-weight="700" fill="#0c447c">Detect a match the instant both users swipe right, even simultaneously</text>
<text x="400" y="2986" text-anchor="middle" font-size="11" fill="#185fa5">Redis Lua GETSET on canonical key (min:max userId) is atomic and single-threaded. The race condition between two simultaneous right-swipes is eliminated at the Redis level — not the application level.</text>

<rect x="30" y="3008" width="740" height="52" rx="8" fill="#faeeda" stroke="#ba7517"/>
<text x="400" y="3028" text-anchor="middle" font-size="12" font-weight="700" fill="#633806">Handle millions of swipes per day without bottlenecks</text>
<text x="400" y="3046" text-anchor="middle" font-size="11" fill="#854f0b">Swipe write path is minimal: rate check (Redis), record swipe (Redis SET), publish to Kafka. All expensive operations (ELO recompute, deck rebuild, ES update) are async Kafka consumers. The hot path is sub-10ms.</text>

<rect x="30" y="3068" width="740" height="52" rx="8" fill="#eedefe" stroke="#7f77dd"/>
<text x="400" y="3088" text-anchor="middle" font-size="12" font-weight="700" fill="#3c3489">Know who is near me without exposing my exact location</text>
<text x="400" y="3106" text-anchor="middle" font-size="11" fill="#534ab7">Coordinates snapped to H3 hexagonal grid (1.1km cell). Only binned distance shown in UI. Exact lat/lng never returned to clients. Triangulation attacks prevented because position is grid-locked, not floating point.</text>

<rect x="30" y="3128" width="740" height="52" rx="8" fill="#faece7" stroke="#993c1d"/>
<text x="400" y="3148" text-anchor="middle" font-size="12" font-weight="700" fill="#712b13">Trust that profiles are real people (photo verification, reports)</text>
<text x="400" y="3166" text-anchor="middle" font-size="11" fill="#993c1d">ML face-match selfie vs all profile photos before granting verified badge. Reports go to Kafka — ML triages, humans review top-scored reports. Repeated reports auto-flag for ban review. Selfies deleted after match check.</text>

<rect x="30" y="3188" width="740" height="52" rx="8" fill="#e1f5ee" stroke="#0f6e56"/>
<text x="400" y="3208" text-anchor="middle" font-size="12" font-weight="700" fill="#085041">Chat messages delivered in real-time to matched users only</text>
<text x="400" y="3226" text-anchor="middle" font-size="11" fill="#0f6e56">Chat Service validates sender is part of the match before routing. Messages persisted to Cassandra (partitioned by matchId) before ACK. Offline users receive FCM push. Cassandra retained 90 days for safety evidence.</text>

<!-- FINAL INSIGHT BOX -->
<rect x="30" y="3256" width="740" height="64" rx="8" fill="#2c2c2a"/>
<text x="400" y="3280" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">The core insight: Tinder's ELO is not about who is "attractive" — it is about mutual desirability.</text>
<text x="400" y="3300" text-anchor="middle" font-size="11" fill="#aaa">A user who gets many right swipes from high-ELO users ranks higher than one who gets many swipes from low-ELO users.</text>
<text x="400" y="3316" text-anchor="middle" font-size="11" fill="#aaa">The algorithm optimises for matches (mutual), not one-sided likes — because matches are what monetises.</text>

<!-- PATTERN SUMMARY -->
<rect x="30" y="3336" width="740" height="88" rx="8" fill="#f1efe8" stroke="#888780"/>
<text x="400" y="3356" text-anchor="middle" font-size="11" font-weight="600" fill="#2c2c2a">Profile: S3 photos → ML pipeline → CDN variants → ES index · Discovery: GEORADIUS → ELO rank → deck cache (Redis LIST)</text>
