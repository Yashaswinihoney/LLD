<text x="400" y="844" text-anchor="middle" font-size="12" font-weight="700" fill="#3c3489">POST /api/publish  { topic, payload, key, priority }</text>
<text x="400" y="860" text-anchor="middle" font-size="11" fill="#534ab7">API key validated → rate limit checked → dispatched to Kafka Producer</text>

<line x1="400" y1="876" x2="400" y2="912" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="100" y="912" width="600" height="148" rx="8" fill="#e1f5ee" stroke="#0f6e56"/>
<text x="400" y="934" text-anchor="middle" font-size="13" font-weight="700" fill="#085041">Broker — Publish Steps</text>
<text x="400" y="952" text-anchor="middle" font-size="11" fill="#0f6e56">1. Schema validate payload (if schema registry configured)</text>
<text x="400" y="968" text-anchor="middle" font-size="11" fill="#0f6e56">2. Compute partition: hash(partitionKey) mod numPartitions</text>
<text x="400" y="984" text-anchor="middle" font-size="11" fill="#0f6e56">3. Append message to partition log (WAL — Write-Ahead Log)</text>
<text x="400" y="1000" text-anchor="middle" font-size="11" fill="#0f6e56">4. Replicate to follower brokers (RF=3, wait for acks=all if strong durability)</text>
<text x="400" y="1016" text-anchor="middle" font-size="11" fill="#0f6e56">5. Return ACK to publisher with offset (partition + offset number)</text>
<text x="400" y="1032" text-anchor="middle" font-size="11" fill="#0f6e56">6. Consumer groups poll their partition offset → process → commit offset</text>
<text x="400" y="1048" text-anchor="middle" font-size="11" fill="#0f6e56">7. Consumer delivers to handler → ACK or NACK (retry / DLQ)</text>
<text x="400" y="1060" text-anchor="middle" font-size="11" fill="#0f6e56">8. Fan-out: each consumer group is independent — N groups = N independent deliveries</text>

<!-- ====== SECTION 8: CONCURRENCY MODEL ====== -->
<line x1="30" y1="1348" x2="770" y2="1348" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
<text x="400" y="1341" text-anchor="middle" font-size="11" font-weight="600" fill="#888">— concurrency + thread safety (Req 5) —</text>

<rect x="30"  y="1356" width="350" height="148" rx="8" fill="#faece7" stroke="#993c1d"/>
<text x="205" y="1378" text-anchor="middle" font-size="12" font-weight="700" fill="#712b13">LLD Concurrency Mechanisms</text>
<text x="205" y="1398" text-anchor="middle" font-size="11" fill="#993c1d">ReentrantReadWriteLock on Topic</text>
<text x="205" y="1414" text-anchor="middle" font-size="11" fill="#993c1d">Read lock: concurrent fan-out delivery</text>
<text x="205" y="1430" text-anchor="middle" font-size="11" fill="#993c1d">Write lock: subscribe / unsubscribe only</text>
<text x="205" y="1446" text-anchor="middle" font-size="11" fill="#993c1d">BlockingQueue per subscriber (backpressure)</text>
<text x="205" y="1462" text-anchor="middle" font-size="11" fill="#993c1d">ConcurrentHashMap for topic + sub registry</text>
<text x="205" y="1478" text-anchor="middle" font-size="11" fill="#993c1d">Single thread per subscriber (ordering)</text>
<text x="205" y="1494" text-anchor="middle" font-size="11" fill="#993c1d">CopyOnWriteArrayList for message log</text>

<rect x="420" y="1356" width="350" height="148" rx="8" fill="#faece7" stroke="#993c1d"/>
<text x="595" y="1378" text-anchor="middle" font-size="12" font-weight="700" fill="#712b13">HLD Concurrency (Kafka)</text>
<text x="595" y="1398" text-anchor="middle" font-size="11" fill="#993c1d">Partitions = unit of parallelism</text>
<text x="595" y="1414" text-anchor="middle" font-size="11" fill="#993c1d">One consumer per partition per group</text>
<text x="595" y="1430" text-anchor="middle" font-size="11" fill="#993c1d">Offset commit = durable progress tracking</text>
<text x="595" y="1446" text-anchor="middle" font-size="11" fill="#993c1d">Rebalancing on consumer join/leave</text>
<text x="595" y="1462" text-anchor="middle" font-size="11" fill="#993c1d">ISR (In-Sync Replicas) for durability</text>
<text x="595" y="1478" text-anchor="middle" font-size="11" fill="#993c1d">Leader election on broker failure</text>
<text x="595" y="1494" text-anchor="middle" font-size="11" fill="#993c1d">Idempotent producers: exactly-once</text>

<rect x="30"  y="1536" width="350" height="116" rx="8" fill="#faeeda" stroke="#ba7517"/>
<text x="205" y="1558" text-anchor="middle" font-size="12" font-weight="700" fill="#633806">Retry Strategy</text>
<text x="205" y="1578" text-anchor="middle" font-size="11" fill="#854f0b">Consumer fails → NACK the message</text>
<text x="205" y="1594" text-anchor="middle" font-size="11" fill="#854f0b">Retry topic: orders-retry-1 (delay 1s)</text>

<text x="400" y="2173" text-anchor="middle" font-size="11" font-weight="600" fill="#888">— LLD vs HLD comparison —</text>

<text x="206" y="2210" text-anchor="middle" font-size="12" font-weight="700" fill="#2c2c2a">LLD (In-Process)</text>
<text x="206" y="2230" text-anchor="middle" font-size="11" fill="#5f5e5a">Broker: Singleton in JVM</text>
<text x="206" y="2246" text-anchor="middle" font-size="11" fill="#5f5e5a">Topic: CopyOnWriteArrayList log</text>
<text x="206" y="2262" text-anchor="middle" font-size="11" fill="#5f5e5a">Fan-out: RW lock + direct deliver()</text>
<text x="206" y="2278" text-anchor="middle" font-size="11" fill="#5f5e5a">Subscriber: BlockingQueue inbox</text>
<text x="206" y="2294" text-anchor="middle" font-size="11" fill="#5f5e5a">Ordering: single thread per subscriber</text>
<text x="206" y="2310" text-anchor="middle" font-size="11" fill="#5f5e5a">Retry: in-process with sleep()</text>
<text x="206" y="2326" text-anchor="middle" font-size="11" fill="#5f5e5a">Replay: MessageCursor over list</text>
<text x="206" y="2346" text-anchor="middle" font-size="11" fill="#5f5e5a">Scale: single machine, 100K msgs/sec</text>
<text x="206" y="2366" text-anchor="middle" font-size="11" fill="#5f5e5a">Durability: in-memory (lost on restart)</text>

<rect x="418" y="2188" width="352" height="188" rx="8" fill="#e1f5ee" stroke="#0f6e56"/>
<text x="594" y="2210" text-anchor="middle" font-size="12" font-weight="700" fill="#085041">HLD (Distributed — Kafka)</text>
<text x="594" y="2230" text-anchor="middle" font-size="11" fill="#0f6e56">Broker: Kafka cluster (3–100 nodes)</text>
<text x="594" y="2246" text-anchor="middle" font-size="11" fill="#0f6e56">Topic: partitioned disk-backed log</text>
<text x="594" y="2262" text-anchor="middle" font-size="11" fill="#0f6e56">Fan-out: consumer groups pull model</text>
<text x="594" y="2278" text-anchor="middle" font-size="11" fill="#0f6e56">Subscriber: consumer group instances</text>
<text x="594" y="2294" text-anchor="middle" font-size="11" fill="#0f6e56">Ordering: guaranteed per partition</text>
<text x="594" y="2310" text-anchor="middle" font-size="11" fill="#0f6e56">Retry: retry topics + exponential backoff</text>
<text x="594" y="2326" text-anchor="middle" font-size="11" fill="#0f6e56">Replay: seek to offset (any time)</text>
<text x="594" y="2346" text-anchor="middle" font-size="11" fill="#0f6e56">Scale: 1M+ msgs/sec per broker</text>
<text x="594" y="2366" text-anchor="middle" font-size="11" fill="#0f6e56">Durability: RF=3, WAL, disk persisted</text>

<!-- ====== SECTION 14: REQUIREMENTS MAP ====== -->
<line x1="30" y1="2400" x2="770" y2="2400" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
<text x="400" y="2393" text-anchor="middle" font-size="11" font-weight="600" fill="#888">— all 6 requirements → design decisions —</text>

<rect x="30" y="2408" width="740" height="48" rx="8" fill="#e1f5ee" stroke="#0f6e56"/>
<text x="400" y="2428" text-anchor="middle" font-size="12" font-weight="700" fill="#085041">Req 1: Publishers publish to specific topics</text>
<text x="400" y="2446" text-anchor="middle" font-size="11" fill="#0f6e56">POST /api/publish with topic name. Broker validates topic exists, computes partition (hash(key) mod N), appends to partition log. ACK returned with offset. Publisher never knows who subscribes — fully decoupled.</text>

<rect x="30" y="2468" width="740" height="48" rx="8" fill="#e6f1fb" stroke="#185fa5"/>
<text x="400" y="2488" text-anchor="middle" font-size="12" font-weight="700" fill="#0c447c">Req 2: Subscribers subscribe + receive messages</text>
<text x="400" y="2506" text-anchor="middle" font-size="11" fill="#185fa5">Consumer groups poll their assigned partitions. Offset tracks position — commit only after successful processing. Replay from any offset (seek to beginning, seek to timestamp). Late subscribers get all historical messages within retention window.</text>

<rect x="30" y="2528" width="740" height="48" rx="8" fill="#faeeda" stroke="#ba7517"/>
<text x="400" y="2548" text-anchor="middle" font-size="12" font-weight="700" fill="#633806">Req 3: Multiple publishers and subscribers</text>
<text x="400" y="2566" text-anchor="middle" font-size="11" fill="#854f0b">Any number of publishers write to any topic concurrently. Each consumer group is an independent subscriber — N consumer groups = N independent delivery streams from the same topic. No coordination needed between groups.</text>

<rect x="30" y="2588" width="740" height="48" rx="8" fill="#eedefe" stroke="#7f77dd"/>
<text x="400" y="2608" text-anchor="middle" font-size="12" font-weight="700" fill="#3c3489">Req 4: Real-time delivery to all subscribers</text>
<text x="400" y="2626" text-anchor="middle" font-size="11" fill="#534ab7">Kafka consumer poll latency: 1–5ms with min.poll.interval=0. Push-based delivery in LLD (BlockingQueue). Pull-based in HLD (consumer polls). Fan-out: each consumer group reads independently — no head-of-line blocking between groups.</text>

<rect x="30" y="2648" width="740" height="48" rx="8" fill="#faece7" stroke="#993c1d"/>
<text x="400" y="2668" text-anchor="middle" font-size="12" font-weight="700" fill="#712b13">Req 5: Concurrent access + thread safety</text>
<text x="400" y="2686" text-anchor="middle" font-size="11" fill="#993c1d">LLD: ReentrantReadWriteLock on Topic (read=concurrent delivery, write=subscribe/unsubscribe). BlockingQueue per subscriber (bounded backpressure). Single thread per subscriber (message ordering). ConcurrentHashMap throughout.</text>

<rect x="30" y="2708" width="740" height="48" rx="8" fill="#e1f5ee" stroke="#0f6e56"/>
<text x="400" y="2728" text-anchor="middle" font-size="12" font-weight="700" fill="#085041">Req 6: Scalable + efficient message delivery</text>
<text x="400" y="2746" text-anchor="middle" font-size="11" fill="#0f6e56">Partitions = parallelism unit. Add partitions → scale throughput linearly. Add consumer instances → scale consumption. Zero-copy I/O (sendfile). Sequential disk writes (OS page cache). Batching reduces per-message overhead 100x. Consumer lag auto-scaling via KEDA.</text>

<!-- FINAL -->
<rect x="30" y="2768" width="740" height="60" rx="8" fill="#2c2c2a"/>
<text x="400" y="2790" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">The fundamental design: publisher and subscriber never know each other exists. The topic is the contract.</text>
<text x="400" y="2810" text-anchor="middle" font-size="11" fill="#aaa">Each consumer group tracks its own offset → one slow subscriber never blocks another. Replay from any offset at any time.</text>

<!-- PATTERN TABLE -->
<rect x="30" y="2840" width="740" height="64" rx="8" fill="#f1efe8" stroke="#888780"/>
<text x="400" y="2860" text-anchor="middle" font-size="11" font-weight="600" fill="#2c2c2a">Singleton=MessageBroker · State=SubscriptionStatus(ACTIVE/PAUSED/CANCELLED) + MessageStatus(PENDING→DELIVERED/FAILED/DLQ)</text>
<text x="400" y="2878" text-anchor="middle" font-size="11" fill="#5f5e5a">Strategy=DeliveryStrategy(Sync/Async) + RetryStrategy(Fixed/ExponentialBackoff) · Observer=Subscriber (pub-sub IS the Observer pattern)</text>
<text x="400" y="2896" text-anchor="middle" font-size="10" fill="#888">Factory=TopicFactory(standard/partitioned/fanout/priority) · Builder=Message.Builder+Topic.Builder · Command=PublishCommand(execute+replay) · Iterator=MessageCursor(offset-based)</text>
