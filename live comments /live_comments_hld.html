<!-- ====== SECTION 6: FAN-OUT — THE HARDEST PROBLEM ====== -->
<line x1="30" y1="1168" x2="770" y2="1168" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
<text x="400" y="1161" text-anchor="middle" font-size="11" font-weight="600" fill="#888">— fan-out: delivering one comment to a million viewers — the hardest problem —</text>

<rect x="30" y="1176" width="740" height="80" rx="8" fill="#faece7" stroke="#993c1d"/>
<text x="400" y="1198" text-anchor="middle" font-size="13" font-weight="700" fill="#712b13">The problem: 1 comment posted → must reach 1,000,000 open WebSocket connections</text>
<text x="400" y="1218" text-anchor="middle" font-size="11" fill="#993c1d">Naive approach: publish directly to all 1M sockets. At 100 comments/sec that is 100M WS writes/sec.</text>
<text x="400" y="1238" text-anchor="middle" font-size="11" fill="#993c1d">Not feasible. Any single server holds ~50,000 sockets. 1M viewers = 20+ WS server pods. Must route comments across pods.</text>

<line x1="400" y1="1256" x2="400" y2="1296" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Two fan-out paths -->
<rect x="20"  y="1296" width="358" height="148" rx="8" fill="#e6f1fb" stroke="#185fa5"/>
<text x="199" y="1318" text-anchor="middle" font-size="12" font-weight="700" fill="#0c447c">Small Stream (&lt;10K viewers) — PUSH</text>
<text x="199" y="1338" text-anchor="middle" font-size="11" fill="#185fa5">Fan-out Service: PUBLISH to Redis channel stream:{id}</text>
<text x="199" y="1354" text-anchor="middle" font-size="11" fill="#185fa5">Every WS server is SUBSCRIBED to that channel</text>
<text x="199" y="1370" text-anchor="middle" font-size="11" fill="#185fa5">Each WS server pushes to its own local sockets</text>
<text x="199" y="1386" text-anchor="middle" font-size="11" fill="#185fa5">Total fan-out: O(WS pods) Redis publishes — cheap</text>
<text x="199" y="1402" text-anchor="middle" font-size="11" fill="#185fa5">Latency: &lt;200ms end-to-end from post to all viewers</text>
<text x="199" y="1420" text-anchor="middle" font-size="10" font-weight="600" fill="#0c447c">Push to all — simple, fast, scales to ~10K viewers/stream</text>

<rect x="422" y="1296" width="358" height="148" rx="8" fill="#faeeda" stroke="#ba7517"/>
<text x="601" y="1318" text-anchor="middle" font-size="12" font-weight="700" fill="#633806">Large Stream (&gt;10K viewers) — HYBRID</text>
<text x="601" y="1338" text-anchor="middle" font-size="11" fill="#854f0b">Push only to ACTIVE viewers (typed or clicked in last 60s)</text>
<text x="601" y="1354" text-anchor="middle" font-size="11" fill="#854f0b">Passive viewers ("watching" only) → PULL mode</text>
<text x="601" y="1370" text-anchor="middle" font-size="11" fill="#854f0b">Passive: poll GET /comments?after=lastSeq every 3s</text>
<text x="601" y="1386" text-anchor="middle" font-size="11" fill="#854f0b">Switch: viewer becomes active → server flips to push</text>
<text x="601" y="1402" text-anchor="middle" font-size="11" fill="#854f0b">Result: 1M viewers → only ~5% get real-time push (active)</text>
<text x="601" y="1420" text-anchor="middle" font-size="10" font-weight="600" fill="#633806">95% passive viewers barely notice 3s polling delay</text>

<line x1="199" y1="1444" x2="340" y2="1492" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="601" y1="1444" x2="460" y2="1492" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

<!-- ====== SECTION 7: BATCHING ====== -->
<line x1="30" y1="1480" x2="770" y2="1480" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
<text x="400" y="1474" text-anchor="middle" font-size="11" font-weight="600" fill="#888">— comment batching: push once per 500ms, not once per comment —</text>

<rect x="80" y="1492" width="640" height="120" rx="8" fill="#e1f5ee" stroke="#0f6e56"/>
<text x="400" y="1514" text-anchor="middle" font-size="13" font-weight="700" fill="#085041">Batching Window — Critical at Scale</text>
<text x="400" y="1534" text-anchor="middle" font-size="11" fill="#0f6e56">Fan-out Service holds a 500ms rolling buffer per stream. At 100 comments/sec → 50 comments per batch.</text>
<text x="400" y="1550" text-anchor="middle" font-size="11" fill="#0f6e56">One WS push per 500ms instead of 100 pushes/sec. Reduces WS frames by 100× — massive bandwidth saving.</text>
<text x="400" y="1566" text-anchor="middle" font-size="11" fill="#0f6e56">Clients receive an array: [{ id, user, text, ts }, ...] and render the scroll atomically — no jank.</text>
<text x="400" y="1582" text-anchor="middle" font-size="11" fill="#0f6e56">SCROLL CAPPING: if batch &gt; 30 comments, show latest 30 + "↑ X new messages" indicator above the visible window.</text>
<text x="400" y="1598" text-anchor="middle" font-size="10" font-weight="600" fill="#085041">This is how YouTube / Twitch show comments in bursts — never 1-by-1 at high volume</text>

<line x1="400" y1="1612" x2="400" y2="1652" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

<!-- ====== SECTION 8: MODERATION ====== -->
<line x1="30" y1="1640" x2="770" y2="1640" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
<text x="400" y="1634" text-anchor="middle" font-size="11" font-weight="600" fill="#888">— moderation: two-layer pipeline (pre + post-publish) —</text>

<rect x="20"  y="1652" width="366" height="144" rx="8" fill="#faece7" stroke="#993c1d"/>
<text x="203" y="1674" text-anchor="middle" font-size="12" font-weight="700" fill="#712b13">Layer 1 — Pre-Publish (Synchronous, &lt;10ms)</text>
<text x="203" y="1694" text-anchor="middle" font-size="11" fill="#993c1d">Exact blocklist: regex on slurs, phone numbers, URLs</text>
<text x="203" y="1710" text-anchor="middle" font-size="11" fill="#993c1d">Fast ML: TF-Lite model, binary classify (spam/not)</text>
<text x="203" y="1726" text-anchor="middle" font-size="11" fill="#993c1d">Trust gate: new account (&lt;7 days) + all-caps + link = hold</text>
<text x="203" y="1742" text-anchor="middle" font-size="11" fill="#993c1d">User ban list: Redis SET banned:{streamId} lookup O(1)</text>
<text x="203" y="1758" text-anchor="middle" font-size="11" fill="#993c1d">RESULT: BLOCKED → not published at all. Poster sees error.</text>
<text x="203" y="1778" text-anchor="middle" font-size="10" font-weight="600" fill="#712b13">Goal: stop the obvious 90%. Fast enough to not slow the post path.</text>

<text x="597" y="1674" text-anchor="middle" font-size="12" font-weight="700" fill="#633806">Layer 2 — Post-Publish (Async, full ML)</text>
<text x="597" y="1694" text-anchor="middle" font-size="11" fill="#854f0b">Deep NLP model: BERT-based hate / harassment / NSFW</text>
<text x="597" y="1710" text-anchor="middle" font-size="11" fill="#854f0b">Runs on Kafka consumer — does NOT block the post path</text>
<text x="597" y="1726" text-anchor="middle" font-size="11" fill="#854f0b">If score &gt; threshold: PUBLISH delete-event to stream</text>
<text x="597" y="1742" text-anchor="middle" font-size="11" fill="#854f0b">Clients receive { type:"delete", commentId } → remove from UI</text>
<text x="597" y="1758" text-anchor="middle" font-size="11" fill="#854f0b">Persist in Cassandra with status=REMOVED, store reason</text>
<text x="597" y="1778" text-anchor="middle" font-size="10" font-weight="600" fill="#633806">May appear briefly (ms) — acceptable trade-off for low latency.</text>

<!-- ====== SECTION 11: ORDERING ====== -->
<line x1="30" y1="2220" x2="770" y2="2220" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
<text x="400" y="2213" text-anchor="middle" font-size="11" font-weight="600" fill="#888">— comment ordering: do you need strict global order? no — here's why —</text>

<rect x="30" y="2228" width="740" height="112" rx="8" fill="#2c2c2a"/>
<text x="400" y="2250" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Ordering in Live Chat: Approximate is Fine, and Here's Why</text>
<text x="400" y="2270" text-anchor="middle" font-size="11" fill="#aaa">Two users post within 100ms of each other. Does it matter which appears first? No — humans can't read that fast anyway.</text>
<text x="400" y="2286" text-anchor="middle" font-size="11" fill="#aaa">Mechanism: server-assigned sequenceNum (Redis INCR) gives total ordering on the ingest side. Within a 500ms batch,</text>
<text x="400" y="2302" text-anchor="middle" font-size="11" fill="#aaa">comments are sorted by (sequenceNum) before sending. This gives a consistent, stable order across all viewers.</text>
<text x="400" y="2318" text-anchor="middle" font-size="11" fill="#aaa">Kafka partition key = streamId ensures all comments for one stream flow through ONE partition — strict Kafka ordering.</text>
<text x="400" y="2334" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">Global strict order across partitions is not needed — live chat tolerance is &gt;1s. Strict order costs disproportionately.</text>

<line x1="400" y1="2340" x2="400" y2="2380" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

<!-- ====== SECTION 12: WS SERVER ROUTING ====== -->
<line x1="30" y1="2368" x2="770" y2="2368" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
<text x="400" y="2362" text-anchor="middle" font-size="11" font-weight="600" fill="#888">— WebSocket server routing: how a message published to Kafka reaches the right pods —</text>

<rect x="40" y="2380" width="720" height="132" rx="8" fill="#eedefe" stroke="#7f77dd"/>
<text x="400" y="2402" text-anchor="middle" font-size="13" font-weight="700" fill="#3c3489">Redis Pub/Sub as the Cross-Pod Router</text>
<text x="400" y="2422" text-anchor="middle" font-size="11" fill="#534ab7">WS Server pods are stateless. Any viewer could be connected to any pod (LB routes new connections, IP-hash for existing).</text>
<text x="400" y="2438" text-anchor="middle" font-size="11" fill="#534ab7">Every WS server pod SUBSCRIBES to Redis channel: stream:{streamId} on startup.</text>
<text x="400" y="2454" text-anchor="middle" font-size="11" fill="#534ab7">Fan-out Service receives from Kafka → batch → PUBLISH to Redis channel stream:{streamId}</text>
<text x="400" y="2470" text-anchor="middle" font-size="11" fill="#534ab7">Every WS pod receives the batch. Each pod checks its in-memory socket map: which of MY sockets are watching this stream?</text>
<text x="400" y="2486" text-anchor="middle" font-size="11" fill="#534ab7">Pod pushes to ONLY its own sockets for that stream. No central registry of "who is where" needed.</text>
<text x="400" y="2500" text-anchor="middle" font-size="10" font-weight="600" fill="#3c3489">Cost: N_pods Redis PUBLISH calls. At 20 WS pods = 20 publishes per stream per batch. Negligible.</text>

<line x1="400" y1="2512" x2="400" y2="2552" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

<!-- ====== SECTION 14: VOD REPLAY ====== -->
<line x1="30" y1="2772" x2="770" y2="2772" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
<text x="400" y="2766" text-anchor="middle" font-size="11" font-weight="600" fill="#888">— VOD replay: showing comments at the right timestamp when watching a recording —</text>

<rect x="80" y="2780" width="640" height="116" rx="8" fill="#e1f5ee" stroke="#0f6e56"/>
<text x="400" y="2802" text-anchor="middle" font-size="13" font-weight="700" fill="#085041">Comment Replay for VOD (Recorded Stream)</text>
<text x="400" y="2822" text-anchor="middle" font-size="11" fill="#0f6e56">Each comment in Cassandra has both: serverTimestampMs (wall clock) and streamOffsetMs (seconds into the stream).</text>
<text x="400" y="2838" text-anchor="middle" font-size="11" fill="#0f6e56">streamOffsetMs = serverTimestampMs − streamStartTimestampMs. Computed at ingest time by Ingest Service.</text>
<text x="400" y="2854" text-anchor="middle" font-size="11" fill="#0f6e56">VOD player at 5:32 into video → REST GET /vod/{id}/comments?offset=332000&amp;limit=50</text>
<text x="400" y="2870" text-anchor="middle" font-size="11" fill="#0f6e56">Cassandra range query: WHERE streamId=X AND streamOffsetMs &gt;= 332000 AND &lt;= 337000 (5-sec window)</text>
<text x="400" y="2886" text-anchor="middle" font-size="10" font-weight="600" fill="#085041">Comments appear on screen exactly as they did during the live stream — same scroll, same burst, same emotes</text>

<!-- ====== SECTION 15: KEY DECISIONS ====== -->
<line x1="30" y1="2916" x2="770" y2="2916" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
<text x="400" y="2910" text-anchor="middle" font-size="11" font-weight="600" fill="#888">— 5 design decisions every interviewer asks about —</text>

<rect x="30" y="2924" width="740" height="68" rx="8" fill="#e1f5ee" stroke="#0f6e56"/>
<text x="400" y="2946" text-anchor="middle" font-size="12" font-weight="700" fill="#085041">① WebSocket vs SSE vs polling — why WebSocket wins here</text>
<text x="400" y="2966" text-anchor="middle" font-size="11" fill="#0f6e56">SSE is server-push only — you need the same connection for posting comments (bidirectional). Polling at 500ms costs 2 requests/sec × 1M viewers = 2M requests/sec continuously, even during slow chat. WebSocket stays open and sends only when there's data.</text>

<rect x="30" y="3004" width="740" height="68" rx="8" fill="#e6f1fb" stroke="#185fa5"/>
<text x="400" y="3026" text-anchor="middle" font-size="12" font-weight="700" fill="#0c447c">② Why Cassandra and not PostgreSQL for comment storage</text>
<text x="400" y="3046" text-anchor="middle" font-size="11" fill="#185fa5">A 12-hour stream at 100 comments/sec = 4.3M rows per stream. Multiple streams simultaneously. Cassandra's partition key = streamId means all writes for one stream go to the same set of nodes — O(1) append. PostgreSQL single-primary write bottleneck under this volume.</text>

<rect x="30" y="3084" width="740" height="68" rx="8" fill="#faeeda" stroke="#ba7517"/>
<text x="400" y="3106" text-anchor="middle" font-size="12" font-weight="700" fill="#633806">③ Why the recent-comment Redis list exists alongside Cassandra</text>
<text x="400" y="3126" text-anchor="middle" font-size="11" fill="#854f0b">Cassandra is durable but not designed for ultra-low-latency repeated reads. Every viewer joining a popular stream would hammer the same partition. Redis LRANGE (last 200 comments) returns in &lt;2ms with zero Cassandra load. It is a hot cache, not the source of truth.</text>

<rect x="30" y="3164" width="740" height="68" rx="8" fill="#eedefe" stroke="#7f77dd"/>
<text x="400" y="3186" text-anchor="middle" font-size="12" font-weight="700" fill="#3c3489">④ Pre-moderation vs post-moderation trade-off</text>
<text x="400" y="3206" text-anchor="middle" font-size="11" fill="#534ab7">Pre-moderation (hold all until approved) = zero harmful content, but comments delayed 30–60s — kills the live feel. Post-moderation (publish first, delete if caught) = comments appear instantly, bad content visible for milliseconds before ML catches it. Live chat always uses post-moderation.</text>

<rect x="30" y="3244" width="740" height="68" rx="8" fill="#faece7" stroke="#993c1d"/>
<text x="400" y="3266" text-anchor="middle" font-size="12" font-weight="700" fill="#712b13">⑤ How the push/pull threshold is decided at runtime</text>
<text x="400" y="3286" text-anchor="middle" font-size="11" fill="#993c1d">Fan-out Service checks Redis: SCARD active:{streamId} (count of users who interacted in last 60s). Below threshold → pure push. Above → split: push to active SET members only, passive clients get a "poll_url" in their WS subscribe ACK and fall back to polling automatically.</text>

<!-- FINAL INSIGHT BOX -->
<rect x="30" y="3328" width="740" height="64" rx="8" fill="#2c2c2a"/>
<text x="400" y="3352" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">The core architecture decision: publisher never waits for fan-out to complete.</text>
<text x="400" y="3372" text-anchor="middle" font-size="11" fill="#aaa">Poster gets ACK the moment the comment hits Kafka. Fan-out, moderation, and persistence all happen async.</text>
<text x="400" y="3388" text-anchor="middle" font-size="11" fill="#aaa">Redis pub/sub routes comments across WS pods without a central registry. Batching reduces WS frames by 100×. The hard part is not sending a comment — it is delivering it at scale without melting your infrastructure.</text>
