<text x="400" y="44" text-anchor="middle" font-size="11" fill="#aaa">Driver-to-Pickup ETA · Trip ETA · Map Graph · ML Model · Real-Time Traffic · Confidence Interval</text>

<rect x="0" y="56" width="800" height="20" fill="#2b6ef5"/>
<text x="400" y="70" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" letter-spacing="1">UBER PRODUCES TWO SEPARATE ETA NUMBERS — NOT ONE</text>

<rect x="420" y="84" width="350" height="52" rx="8" fill="#eedefe" stroke="#7f77dd"/>
<text x="595" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#3c3489">ETA #2 — Pickup to Destination</text>
<text x="595" y="124" text-anchor="middle" font-size="11" fill="#534ab7">"Trip will take 23 min"</text>

<line x1="205" y1="136" x2="205" y2="176" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="595" y1="136" x2="595" y2="176" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

<!-- ═══ ETA #1: DRIVER TO PICKUP ═══ -->
<rect x="0" y="172" width="800" height="20" fill="#0c447c"/>
<text x="400" y="186" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" letter-spacing="1">ETA #1 — HOW UBER KNOWS HOW FAR AWAY YOUR DRIVER IS</text>

<!-- Input 1: Driver GPS -->
<rect x="20"  y="200" width="350" height="92" rx="8" fill="#e6f1fb" stroke="#185fa5"/>
<text x="195" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#0c447c">Input A: Driver GPS Stream</text>
<text x="195" y="242" text-anchor="middle" font-size="10" fill="#185fa5">Driver app pings every 4 seconds: { lat, lng, heading, speed }</text>
<text x="195" y="258" text-anchor="middle" font-size="10" fill="#185fa5">Stored in Redis: driver:{id}:location (TTL 10s — offline if no ping)</text>
<text x="195" y="274" text-anchor="middle" font-size="10" fill="#185fa5">Map-matched to nearest road segment → eliminates GPS jitter</text>
<text x="195" y="290" text-anchor="middle" font-size="10" fill="#185fa5">(raw GPS can place driver 15m off-road; map-matching corrects this)</text>

<!-- Input 2: Road Graph -->
<rect x="430" y="200" width="350" height="92" rx="8" fill="#e6f1fb" stroke="#185fa5"/>
<text x="605" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#0c447c">Input B: Road Network Graph</text>
<text x="605" y="242" text-anchor="middle" font-size="10" fill="#185fa5">Pre-built weighted directed graph: nodes=intersections, edges=road segments</text>
<text x="605" y="258" text-anchor="middle" font-size="10" fill="#185fa5">Edge weight = travel_time (not distance) — one-way roads, turn costs included</text>
<text x="605" y="274" text-anchor="middle" font-size="10" fill="#185fa5">Partitioned into H3 hexagonal cells (Uber open-source) — one cell per cluster</text>
<text x="605" y="290" text-anchor="middle" font-size="10" fill="#185fa5">Updated nightly from OpenStreetMap + Uber's own driven data</text>

<line x1="195" y1="292" x2="320" y2="340" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="605" y1="292" x2="480" y2="340" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Routing Engine -->
<rect x="160" y="340" width="480" height="92" rx="8" fill="#2b6ef5"/>
<text x="400" y="364" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Routing Engine (Uber's own — not Google Maps)</text>
<text x="400" y="382" text-anchor="middle" font-size="11" fill="#cde" >Algorithm: Contraction Hierarchies (CH) — faster than Dijkstra for large graphs</text>
<text x="400" y="398" text-anchor="middle" font-size="11" fill="#cde">Pre-contracts the graph offline → query time &lt;10ms even on city-scale graph</text>
<text x="400" y="414" text-anchor="middle" font-size="11" fill="#cde">Finds 3 candidate routes → each scored independently by the ML model</text>

<line x1="280" y1="432" x2="200" y2="472" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="520" y1="432" x2="600" y2="472" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Input 3: Real-time traffic -->
<rect x="20"  y="472" width="350" height="80" rx="8" fill="#faeeda" stroke="#ba7517"/>
<text x="195" y="494" text-anchor="middle" font-size="12" font-weight="700" fill="#633806">Input C: Real-Time Traffic Layer</text>
<text x="195" y="512" text-anchor="middle" font-size="10" fill="#854f0b">Aggregated from millions of Uber driver GPS streams (passive crowdsource)</text>
<text x="195" y="528" text-anchor="middle" font-size="10" fill="#854f0b">Speed per road segment updated every 30s: segment:{h3_cell}:{road_id} → speed</text>
<text x="195" y="544" text-anchor="middle" font-size="10" fill="#854f0b">Edge weight in routing graph dynamically overridden at query time</text>

<!-- Input 4: ML historical model -->
<rect x="430" y="472" width="350" height="80" rx="8" fill="#eedefe" stroke="#7f77dd"/>
<text x="605" y="494" text-anchor="middle" font-size="12" font-weight="700" fill="#3c3489">Input D: Historical ML Model</text>
<text x="605" y="512" text-anchor="middle" font-size="10" fill="#534ab7">Trained on billions of Uber trips: (route, time_of_day, day_of_week) → actual_time</text>
<text x="605" y="528" text-anchor="middle" font-size="10" fill="#534ab7">Captures patterns pure routing misses: school runs, office rush, rain slowdown</text>
<text x="605" y="544" text-anchor="middle" font-size="10" fill="#534ab7">Features: h3_origin, h3_dest, hour, weekday, weather_code, surge_zone</text>

<line x1="195" y1="552" x2="320" y2="596" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="605" y1="552" x2="480" y2="596" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

<!-- ETA Blender -->
<rect x="160" y="596" width="480" height="96" rx="8" fill="#eaf3de" stroke="#3b6d11"/>
<text x="400" y="620" text-anchor="middle" font-size="13" font-weight="700" fill="#085041">ETA Blender — Weighted Ensemble</text>
<text x="400" y="640" text-anchor="middle" font-size="11" fill="#0f6e56">routing_eta = travel time on best route using live edge weights</text>
<text x="400" y="656" text-anchor="middle" font-size="11" fill="#0f6e56">ml_eta       = ML model prediction for this (origin, dest, time_of_day)</text>
<text x="400" y="672" text-anchor="middle" font-size="11" fill="#0f6e56">final_eta    = 0.6 × routing_eta + 0.4 × ml_eta  (weights tuned by A/B test)</text>
<text x="400" y="688" text-anchor="middle" font-size="10" font-weight="600" fill="#27500a">Neither alone is best: routing misses patterns, ML misses live incidents. Blend wins.</text>

<line x1="400" y1="692" x2="400" y2="732" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

<!-- ETA Output 1 -->
<rect x="180" y="732" width="440" height="56" rx="8" fill="#1a1a1a"/>
<text x="400" y="754" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">ETA #1 Output: "Driver arrives in 4 min"</text>
<text x="400" y="772" text-anchor="middle" font-size="11" fill="#aaa">Displayed with a confidence band: shown as a single number but backed by a P50 estimate</text>
<text x="400" y="784" text-anchor="middle" font-size="11" fill="#aaa">(P90 used internally for SLA checks — if P90 &gt; threshold, driver is flagged as too far)</text>

<!-- ═══ ETA #2: PICKUP TO DESTINATION ═══ -->
<line x1="30" y1="820" x2="770" y2="820" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="0" y="828" width="800" height="20" fill="#3c3489"/>
<text x="400" y="842" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" letter-spacing="1">ETA #2 — HOW UBER ESTIMATES THE TRIP DURATION</text>

<rect x="40" y="860" width="720" height="120" rx="8" fill="#eedefe" stroke="#7f77dd"/>
<text x="400" y="882" text-anchor="middle" font-size="13" font-weight="700" fill="#3c3489">Trip ETA: Same Pipeline — Different Origin + Extra Signals</text>
<text x="400" y="902" text-anchor="middle" font-size="11" fill="#534ab7">Origin = pickup pin | Destination = drop pin → same routing engine as ETA #1</text>
<text x="400" y="918" text-anchor="middle" font-size="11" fill="#534ab7">But adds extra features to the ML model that don't exist for driver ETA:</text>
<text x="400" y="934" text-anchor="middle" font-size="11" fill="#534ab7">  ▸ Event detection: stadium/concert nearby → traffic model adjusted</text>
<text x="400" y="950" text-anchor="middle" font-size="11" fill="#534ab7">  ▸ Weather API: heavy rain → apply slowdown multiplier per road category</text>
<text x="400" y="964" text-anchor="middle" font-size="11" fill="#534ab7">  ▸ Surge zone map: high-demand hex cells historically slower (more pickups, more U-turns)</text>

<line x1="400" y1="980" x2="400" y2="1020" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="30" y="1020" width="740" height="104" rx="8" fill="#2b6ef5"/>
<text x="400" y="1044" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Trip ETA Output: Confidence Interval, Not a Point</text>
<text x="400" y="1064" text-anchor="middle" font-size="11" fill="#cde">Model outputs P10, P50, P90 travel times — not a single number</text>
<text x="400" y="1080" text-anchor="middle" font-size="11" fill="#cde">UI shows: P50 (median) — "23 min". Internally: if P90 - P50 &gt; 10min → show "23–35 min"</text>
<text x="400" y="1096" text-anchor="middle" font-size="11" fill="#cde">Fare estimate uses P50 for base, with ±buffer for surge and tolls</text>
<text x="400" y="1112" text-anchor="middle" font-size="10" fill="#cde" font-weight="500">Why not P90 always? Too conservative — 95% of trips beat it. P50 is accurate 50% of time, P10 delights 40% of riders.</text>

<!-- ═══ ETA REFRESH LOOP ═══ -->
<line x1="30" y1="1144" x2="770" y2="1144" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="0" y="1152" width="800" height="20" fill="#633806"/>
<text x="400" y="1166" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" letter-spacing="1">HOW ETA STAYS ACCURATE DURING THE TRIP — THE REFRESH LOOP</text>

<rect x="40" y="1180" width="720" height="120" rx="8" fill="#faeeda" stroke="#ba7517"/>
<text x="400" y="1202" text-anchor="middle" font-size="13" font-weight="700" fill="#633806">Continuous ETA Recalculation</text>
<text x="400" y="1222" text-anchor="middle" font-size="11" fill="#854f0b">1. Driver GPS ping arrives every 4s → Location Service map-matches to road</text>
<text x="400" y="1238" text-anchor="middle" font-size="11" fill="#854f0b">2. Every ping: residual ETA recomputed from current position to destination (not start)</text>
<text x="400" y="1254" text-anchor="middle" font-size="11" fill="#854f0b">3. If new ETA differs from displayed ETA by &gt;1 min → push update to rider app via WebSocket</text>
<text x="400" y="1270" text-anchor="middle" font-size="11" fill="#854f0b">4. If driver deviates from route → reroute triggered, full ETA recompute in &lt;100ms</text>
<text x="400" y="1290" text-anchor="middle" font-size="10" font-weight="600" fill="#633806">ETA is recalculated on every ping but pushed only on meaningful change — avoids flicker</text>

<text x="400" y="1314" text-anchor="middle" font-size="11" font-weight="600" fill="#888">— key data stores powering Uber ETA —</text>

<rect x="20"  y="1328" width="175" height="140" rx="8" fill="#e6f1fb" stroke="#185fa5"/>
<text x="107" y="1350" text-anchor="middle" font-size="11" font-weight="600" fill="#0c447c">Redis</text>
<text x="107" y="1368" text-anchor="middle" font-size="10" fill="#185fa5">driver:{id}:location</text>
<text x="107" y="1384" text-anchor="middle" font-size="10" fill="#185fa5">(GEO, TTL 10s)</text>
<text x="107" y="1400" text-anchor="middle" font-size="10" fill="#185fa5">segment:{id}:speed</text>
<text x="107" y="1416" text-anchor="middle" font-size="10" fill="#185fa5">(live, refresh 30s)</text>
<text x="107" y="1432" text-anchor="middle" font-size="10" fill="#185fa5">surge:{h3_cell}</text>
<text x="107" y="1448" text-anchor="middle" font-size="10" fill="#185fa5">ETA cache 15s TTL</text>

<rect x="211" y="1328" width="175" height="140" rx="8" fill="#eaf3de" stroke="#3b6d11"/>
<text x="298" y="1350" text-anchor="middle" font-size="11" font-weight="600" fill="#27500a">Graph Store</text>
<text x="298" y="1368" text-anchor="middle" font-size="10" fill="#3b6d11">Contracted H3</text>
<text x="298" y="1384" text-anchor="middle" font-size="10" fill="#3b6d11">road graph (S3)</text>
<text x="298" y="1400" text-anchor="middle" font-size="10" fill="#3b6d11">Loaded into memory</text>
<text x="298" y="1416" text-anchor="middle" font-size="10" fill="#3b6d11">on routing pods</text>
<text x="298" y="1432" text-anchor="middle" font-size="10" fill="#3b6d11">Updated nightly</text>
<text x="298" y="1448" text-anchor="middle" font-size="10" fill="#3b6d11">~5GB per city</text>

<rect x="402" y="1328" width="175" height="140" rx="8" fill="#eedefe" stroke="#7f77dd"/>
<text x="489" y="1350" text-anchor="middle" font-size="11" font-weight="600" fill="#3c3489">ML Model Store</text>
<text x="489" y="1368" text-anchor="middle" font-size="10" fill="#534ab7">XGBoost / LightGBM</text>
<text x="489" y="1384" text-anchor="middle" font-size="10" fill="#534ab7">served via TensorFlow</text>
<text x="489" y="1400" text-anchor="middle" font-size="10" fill="#534ab7">Serving (TF Serving)</text>
<text x="489" y="1416" text-anchor="middle" font-size="10" fill="#534ab7">Retrained weekly</text>
<text x="489" y="1432" text-anchor="middle" font-size="10" fill="#534ab7">One model per city</text>
<text x="489" y="1448" text-anchor="middle" font-size="10" fill="#534ab7">P50/P90 output</text>

<rect x="593" y="1328" width="187" height="140" rx="8" fill="#faeeda" stroke="#ba7517"/>
<text x="686" y="1350" text-anchor="middle" font-size="11" font-weight="600" fill="#633806">Trip History (Hive/S3)</text>
<text x="686" y="1368" text-anchor="middle" font-size="10" fill="#854f0b">Billions of trips</text>
<text x="686" y="1384" text-anchor="middle" font-size="10" fill="#854f0b">(origin_h3, dest_h3,</text>
<text x="686" y="1400" text-anchor="middle" font-size="10" fill="#854f0b">hour, day, actual_time)</text>
<text x="686" y="1416" text-anchor="middle" font-size="10" fill="#854f0b">Training data for ML</text>
<text x="686" y="1432" text-anchor="middle" font-size="10" fill="#854f0b">ETA accuracy tracked</text>
<text x="686" y="1448" text-anchor="middle" font-size="10" fill="#854f0b">per city per hour</text>

<!-- UBER INSIGHT BOX -->
<rect x="30" y="1488" width="740" height="56" rx="8" fill="#1a1a1a"/>
<text x="400" y="1510" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">The Uber ETA insight: routing alone is fast but blind to patterns. ML alone is pattern-aware but blind to live incidents.</text>
<text x="400" y="1528" text-anchor="middle" font-size="11" fill="#aaa">A weighted blend — calibrated per city per hour on billions of trips — consistently beats either approach alone.</text>

<!-- ═══ COMPONENT 1: RESTAURANT PREP TIME ═══ -->
<rect x="0" y="1776" width="800" height="20" fill="#c73333"/>
<text x="400" y="1790" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" letter-spacing="1">COMPONENT 1 — RESTAURANT PREPARATION TIME (THE HARDEST TO ESTIMATE)</text>

<rect x="20" y="1808" width="757" height="56" rx="8" fill="#eedefe" stroke="#7f77dd"/>
<text x="400" y="1830" text-anchor="middle" font-size="12" font-weight="700" fill="#3c3489">Why is prep time hard? It is the most variable component — 5 min or 40 min from the same restaurant.</text>
<text x="400" y="1848" text-anchor="middle" font-size="11" fill="#534ab7">Routing engine gives precise travel times. ML for restaurant prep must handle human variability, kitchen load, item complexity, and chef availability.</text>

<line x1="200" y1="864" x2="200" y2="904" stroke="#888" stroke-width="1"/>
<line x1="400" y1="864" x2="400" y2="904" stroke="#888" stroke-width="1"/>

<!-- Four inputs to prep time ML -->
<line x1="130" y1="1864" x2="100" y2="1912" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="280" y1="1864" x2="270" y2="1912" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="450" y1="1864" x2="460" y2="1912" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="650" y1="1864" x2="660" y2="1912" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

<text x="205" y="2270" text-anchor="middle" font-size="11" fill="#185fa5">When partner assigned: GEORADIUS finds nearest</text>

<rect x="420" y="2196" width="350" height="100" rx="8" fill="#e6f1fb" stroke="#185fa5"/>

<!-- ═══ FINAL ETA ASSEMBLY ═══ -->
<rect x="0" y="2596" width="800" height="20" fill="#1a1a1a"/>
<text x="400" y="2610" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" letter-spacing="1">FINAL ETA ASSEMBLY — HOW SWIGGY COMBINES ALL THREE COMPONENTS</text>

<rect x="40" y="2628" width="720" height="120" rx="8" fill="#1a1a1a"/>
<text x="400" y="2652" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Total ETA Formula</text>
<text x="400" y="2676" text-anchor="middle" font-size="11" fill="#aaa">T1 = ML prep time estimate (e.g. 12 min)</text>
<text x="400" y="2694" text-anchor="middle" font-size="11" fill="#aaa">T2 = partner_to_restaurant routing time (e.g. 6 min) — runs in parallel with T1</text>
<text x="400" y="2712" text-anchor="middle" font-size="11" fill="#aaa">T3 = restaurant_to_customer routing time (e.g. 14 min)</text>
<text x="400" y="2728" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Total ETA = max(T1, T2) + T3 + buffer (2–3 min)</text>
<text x="400" y="2744" text-anchor="middle" font-size="10" fill="#aaa">= max(12, 6) + 14 + 3 = 29 min shown as "28–32 min" on Swiggy app</text>

<line x1="400" y1="2748" x2="400" y2="2788" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

<!-- ═══ TIMING ALIGNMENT ═══ -->
<rect x="0" y="2784" width="800" height="20" fill="#c73333"/>
<text x="400" y="2798" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" letter-spacing="1">THE TIMING ALIGNMENT TRICK — WHY PARTNERS DON'T WAIT AT RESTAURANTS</text>

<rect x="40" y="2816" width="720" height="100" rx="8" fill="#eedefe" stroke="#7f77dd"/>
<text x="400" y="2838" text-anchor="middle" font-size="12" font-weight="700" fill="#3c3489">Smart Partner Assignment: Dispatch is Delayed, Not Immediate</text>
<text x="400" y="2858" text-anchor="middle" font-size="11" fill="#534ab7">Order placed → Swiggy computes T1 (prep) and finds available partner at distance D</text>
<text x="400" y="2874" text-anchor="middle" font-size="11" fill="#534ab7">Dispatch delay = T1 − T2 − 2min buffer. Partner only notified after this delay.</text>
<text x="400" y="2890" text-anchor="middle" font-size="11" fill="#534ab7">If T2 &gt; T1: partner dispatched immediately and waits briefly (unavoidable). T2 is minimised by choosing nearest partner.</text>
<text x="400" y="2906" text-anchor="middle" font-size="10" font-weight="600" fill="#3c3489">Goal: partner arrives at restaurant within 1 min of food being ready. Every minute a partner waits = idle cost + cold food.</text>

<!-- ═══ SWIGGY LIVE REFRESH ═══ -->
<line x1="30" y1="2936" x2="770" y2="2936" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>

<text x="400" y="2958" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" letter-spacing="1">HOW ETA STAYS ACCURATE AFTER THE ORDER IS PLACED</text>

<rect x="40" y="2976" width="720" height="116" rx="8" fill="#faece7" stroke="#993c1d"/>
<text x="400" y="2998" text-anchor="middle" font-size="13" font-weight="700" fill="#712b13">Swiggy ETA Live Refresh (State by State)</text>
<text x="400" y="3018" text-anchor="middle" font-size="11" fill="#993c1d">PENDING → ACCEPTED: ETA recalculated when restaurant actually accepts (not just when predicted)</text>
<text x="400" y="3034" text-anchor="middle" font-size="11" fill="#993c1d">ACCEPTED → PREPARING: restaurant taps "Start Preparing" → T1 countdown restarts from live signal</text>
<text x="400" y="3050" text-anchor="middle" font-size="11" fill="#993c1d">PREPARING → READY: restaurant taps "Ready" → partner dispatched immediately, ETA recalculated</text>
<text x="400" y="3066" text-anchor="middle" font-size="11" fill="#993c1d">PICKED UP: T3 countdown starts from partner's actual pickup location (not restaurant coordinates)</text>
<text x="400" y="3082" text-anchor="middle" font-size="10" font-weight="600" fill="#712b13">Each state transition is an opportunity to replace the prediction with a real observation — accuracy improves at each step</text>

<line x1="30" y1="3288" x2="770" y2="3288" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
<text x="400" y="3282" text-anchor="middle" font-size="11" font-weight="600" fill="#888">— Uber vs Swiggy: how their ETA problems differ —</text>

<rect x="20"  y="3296" width="368" height="200" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="1.5"/>
<text x="204" y="3318" text-anchor="middle" font-size="13" font-weight="700" fill="#0c447c">UBER ETA</text>
<text x="204" y="3338" text-anchor="middle" font-size="11" fill="#185fa5">1 variable: travel time (driver to pickup)</text>
<text x="204" y="3354" text-anchor="middle" font-size="11" fill="#185fa5">Origin: driver's real-time GPS location</text>
<text x="204" y="3370" text-anchor="middle" font-size="11" fill="#185fa5">Destination: fixed ride pickup pin</text>
<text x="204" y="3386" text-anchor="middle" font-size="11" fill="#185fa5">Main uncertainty: live traffic</text>
<text x="204" y="3402" text-anchor="middle" font-size="11" fill="#185fa5">ML helps: time-of-day pattern + surge</text>
<text x="204" y="3418" text-anchor="middle" font-size="11" fill="#185fa5">Refreshed every 4s (every GPS ping)</text>
<text x="204" y="3434" text-anchor="middle" font-size="11" fill="#185fa5">No human-in-loop: car travels at physics speed</text>
<text x="204" y="3468" text-anchor="middle" font-size="10" font-weight="600" fill="#0c447c">Accuracy: ±1–2 min is achievable consistently</text>

<rect x="412" y="3296" width="368" height="200" rx="8" fill="#faece7" stroke="#e84646" stroke-width="1.5"/>
<text x="596" y="3318" text-anchor="middle" font-size="13" font-weight="700" fill="#e84646">SWIGGY ETA</text>
<text x="596" y="3338" text-anchor="middle" font-size="11" fill="#993c1d">3 variables: prep + partner travel + delivery</text>
<text x="596" y="3354" text-anchor="middle" font-size="11" fill="#993c1d">Prep time: depends on humans and queue</text>
<text x="596" y="3370" text-anchor="middle" font-size="11" fill="#993c1d">Partner: assigned dynamically after order</text>
<text x="596" y="3386" text-anchor="middle" font-size="11" fill="#993c1d">Main uncertainty: restaurant is unpredictable</text>
<text x="596" y="3402" text-anchor="middle" font-size="11" fill="#993c1d">ML helps: per-restaurant prep time model</text>
<text x="596" y="3418" text-anchor="middle" font-size="11" fill="#993c1d">Refreshed at every state transition (4 gates)</text>
<text x="596" y="3434" text-anchor="middle" font-size="11" fill="#993c1d">Human-in-loop: restaurant taps "Ready" signal</text>
<text x="596" y="3468" text-anchor="middle" font-size="10" font-weight="600" fill="#e84646">Accuracy: ±4–6 min — restaurant is the noise source</text>

<!-- FINAL INSIGHT BOX -->
<rect x="30" y="3516" width="740" height="80" rx="8" fill="#1a1a1a"/>
<text x="400" y="3540" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">The core difference between Uber and Swiggy ETA:</text>
<text x="400" y="3560" text-anchor="middle" font-size="11" fill="#aaa">Uber's problem is physics (traffic). Swiggy's problem is people (restaurant kitchen). Traffic is measurable in real-time.</text>
<text x="400" y="3578" text-anchor="middle" font-size="11" fill="#aaa">Kitchen speed is not — which is why Swiggy obsessively collects "Ready" signals and retrains per-restaurant models daily.</text>
<text x="400" y="3596" text-anchor="middle" font-size="11" fill="#aaa">Both use the same routing engine. The difference is what feeds into it and how much the ML needs to compensate.</text>

<!-- SHARED ARCHITECTURE SUMMARY -->
<rect x="30" y="3616" width="740" height="76" rx="8" fill="#f1efe8" stroke="#888780"/>
<text x="400" y="3636" text-anchor="middle" font-size="11" font-weight="600" fill="#2c2c2a">Shared stack: GPS ping stream → map-matching → road graph (H3 hex grid) → CH routing engine → ML blend → WebSocket push on change</text>
<text x="400" y="3654" text-anchor="middle" font-size="11" fill="#5f5e5a">Uber: 1 ML model (travel time). Swiggy: 2 ML models (travel time + restaurant prep). Both publish P50 to user, track P90 internally for SLA.</text>
<text x="400" y="3672" text-anchor="middle" font-size="11" fill="#5f5e5a">Neither recalculates on every ping — only on meaningful deviation to avoid flicker. Redis caches ETA per (origin_h3, dest_h3) with short TTL.</text>
