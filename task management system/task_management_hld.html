<text x="400" y="1413" text-anchor="middle" font-size="11" font-weight="600" fill="#888">— concurrency safety (Req 6) —</text>

<rect x="30" y="1428" width="740" height="136" rx="8" fill="#faece7" stroke="#993c1d"/>
<text x="400" y="1450" text-anchor="middle" font-size="13" font-weight="700" fill="#712b13">Problem: Alice (manager) and Bob (assignee) update the same task simultaneously</text>
<text x="400" y="1470" text-anchor="middle" font-size="11" fill="#993c1d">Without locking: Alice updates priority → Bob updates due date → one write is silently lost (last-write-wins ❌)</text>

<text x="400" y="1498" text-anchor="middle" font-size="12" font-weight="700" fill="#712b13">Solution: optimistic + pessimistic locking combined</text>

<rect x="50"  y="1508" width="200" height="44" rx="6" fill="#fff" stroke="#993c1d"/>
<text x="150" y="1526" text-anchor="middle" font-size="11" font-weight="600" fill="#712b13">Optimistic Lock (DB)</text>
<text x="150" y="1542" text-anchor="middle" font-size="10" fill="#993c1d">version column — conflict = 409</text>

<rect x="300" y="1508" width="200" height="44" rx="6" fill="#fff" stroke="#993c1d"/>
<text x="400" y="1526" text-anchor="middle" font-size="11" font-weight="600" fill="#712b13">Per-Task Lock (in-process)</text>
<text x="400" y="1542" text-anchor="middle" font-size="10" fill="#993c1d">ReentrantLock(fair=true) per task</text>

<rect x="550" y="1508" width="200" height="44" rx="6" fill="#fff" stroke="#993c1d"/>
<text x="650" y="1526" text-anchor="middle" font-size="11" font-weight="600" fill="#712b13">Redis Distributed Lock</text>
<text x="650" y="1542" text-anchor="middle" font-size="10" fill="#993c1d">SET NX lock:task:{id} TTL=5s</text>

<rect x="160" y="1836" width="480" height="112" rx="8" fill="#faeeda" stroke="#ba7517"/>
<text x="400" y="1858" text-anchor="middle" font-size="13" font-weight="700" fill="#633806">Search Service (Elasticsearch + Redis)</text>
<text x="400" y="1876" text-anchor="middle" font-size="11" fill="#854f0b">GET /tasks?priority=HIGH&amp;assignee=bob&amp;dueBefore=2025-02-01&amp;status=PENDING</text>
<text x="400" y="1892" text-anchor="middle" font-size="11" fill="#854f0b">Simple filters (assignee, status, priority): Redis hash scan — O(n) but &lt;5ms</text>
<text x="400" y="1908" text-anchor="middle" font-size="11" fill="#854f0b">Full-text search (title, description): Elasticsearch with field boosting</text>
<text x="400" y="1924" text-anchor="middle" font-size="11" fill="#854f0b">Sort: by due date / priority / last updated — all supported in ES + Redis ZSET</text>
<text x="400" y="1940" text-anchor="middle" font-size="11" fill="#854f0b">Cursor-based pagination: no OFFSET scans — use task_id cursor for O(log n)</text>
<text x="400" y="1948" text-anchor="middle" font-size="11" fill="#854f0b">Results cached Redis TTL 30s keyed by query hash — invalidated on task update</text>

<text x="205" y="2074" text-anchor="middle" font-size="11" fill="#3b6d11">PATCH /tasks/{id}/status { status: COMPLETED }</text>
<text x="205" y="2090" text-anchor="middle" font-size="11" fill="#3b6d11">State transition validated: must be IN_PROGRESS or REVIEW</text>
<text x="205" y="2106" text-anchor="middle" font-size="11" fill="#3b6d11">completedAt = now() persisted to DB</text>
<text x="205" y="2122" text-anchor="middle" font-size="11" fill="#3b6d11">Kafka: task-completed → notify creator + team</text>
<text x="205" y="2136" text-anchor="middle" font-size="11" fill="#3b6d11">Analytics: completion time tracked</text>

<text x="595" y="2090" text-anchor="middle" font-size="11" fill="#3b6d11">Returns: all comments, status changes,</text>

<text x="400" y="2260" text-anchor="middle" font-size="11" fill="#534ab7">Users viewing a project board subscribe: WS /ws/projects/{projectId}</text>
<text x="400" y="2276" text-anchor="middle" font-size="11" fill="#534ab7">On any task event: Kafka → WS Fan-out Service → Redis pub/sub per project</text>

<!-- ====== SECTION 14: REQUIREMENTS MAP ====== -->
<line x1="30" y1="2636" x2="770" y2="2636" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
<text x="400" y="2629" text-anchor="middle" font-size="11" font-weight="600" fill="#888">— all requirements → design decisions —</text>

<rect x="30" y="2644" width="740" height="48" rx="8" fill="#e1f5ee" stroke="#0f6e56"/>
<text x="400" y="2664" text-anchor="middle" font-size="12" font-weight="700" fill="#085041">Req 1: Create, Update, Delete tasks</text>
<text x="400" y="2682" text-anchor="middle" font-size="11" fill="#0f6e56">Command pattern wraps each operation with undo support. CreateTaskCommand / UpdateTaskCommand / DeleteTaskCommand. Each persists to PostgreSQL, updates Redis cache, publishes to Kafka. Undo stack per user in Redis (last 10 commands).</text>

<rect x="30" y="2704" width="740" height="48" rx="8" fill="#e6f1fb" stroke="#185fa5"/>
<text x="400" y="2724" text-anchor="middle" font-size="12" font-weight="700" fill="#0c447c">Req 2: Title, description, due date, priority, status</text>
<text x="400" y="2742" text-anchor="middle" font-size="11" fill="#185fa5">All stored in PostgreSQL tasks table. Status is a state machine — invalid transitions rejected with 409. Priority stored as enum ordinal for efficient comparison. Due date in UTC, displayed in user's timezone on client.</text>

<rect x="30" y="2764" width="740" height="48" rx="8" fill="#faeeda" stroke="#ba7517"/>
<text x="400" y="2784" text-anchor="middle" font-size="12" font-weight="700" fill="#633806">Req 3: Assign to users + set reminders</text>
<text x="400" y="2802" text-anchor="middle" font-size="11" fill="#854f0b">Assignment: PATCH /tasks/{id}/assignee under distributed lock. Kafka event → assignee notified via email + push. Reminders stored in Redis ZSET (score = Unix timestamp). Worker polls ZRANGEBYSCORE every 30s — no cron drift.</text>

<rect x="30" y="2824" width="740" height="48" rx="8" fill="#eedefe" stroke="#7f77dd"/>
<text x="400" y="2844" text-anchor="middle" font-size="12" font-weight="700" fill="#3c3489">Req 4: Search + filter by priority, due date, assignee</text>
<text x="400" y="2862" text-anchor="middle" font-size="11" fill="#534ab7">Simple filters: Redis hash index (sub-5ms). Full-text: Elasticsearch. Composable filter pipeline in TaskFilter (Iterator pattern) — chain as many filters as needed. Cursor-based pagination (no OFFSET). Cache popular queries 30s.</text>

<rect x="30" y="2884" width="740" height="48" rx="8" fill="#faece7" stroke="#993c1d"/>
<text x="400" y="2904" text-anchor="middle" font-size="12" font-weight="700" fill="#712b13">Req 5: Mark complete + view task history</text>
<text x="400" y="2922" text-anchor="middle" font-size="11" fill="#993c1d">Completion sets completedAt, triggers Kafka task-completed. History = append-only task_comments table (status changes, assignments, comments). Never deleted — full audit trail forever. GET /tasks/{id}/history returns sorted timeline.</text>

<rect x="30" y="2944" width="740" height="48" rx="8" fill="#e1f5ee" stroke="#0f6e56"/>
<text x="400" y="2964" text-anchor="middle" font-size="12" font-weight="700" fill="#085041">Req 6: Concurrent access + data consistency</text>
<text x="400" y="2982" text-anchor="middle" font-size="11" fill="#0f6e56">Three layers: Redis SET NX distributed lock (cross-pod) + PostgreSQL optimistic locking (version column, 409 on conflict) + ReentrantLock(fair=true) in-process (same pod). Together: zero lost updates, FIFO fairness.</text>

<rect x="30" y="3004" width="740" height="48" rx="8" fill="#e6f1fb" stroke="#185fa5"/>
<text x="400" y="3024" text-anchor="middle" font-size="12" font-weight="700" fill="#0c447c">Req 7: Extensible design</text>
<text x="400" y="3042" text-anchor="middle" font-size="11" fill="#185fa5">Strategy: add new sort order (by project, by tags) without touching Task Service. Observer: add Slack notification or GitHub issue sync without changing core logic. Factory: add RecurringTask or EpicTask type in one class. Command: undo/redo chain extendable.</text>

<!-- FINAL -->
<rect x="30" y="3064" width="740" height="60" rx="8" fill="#2c2c2a"/>
<text x="400" y="3086" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">The hardest problem in task management: concurrent edits + a complete, unforgeable history.</text>
<text x="400" y="3106" text-anchor="middle" font-size="11" fill="#aaa">Redis lock + PostgreSQL optimistic concurrency + append-only comment log = no lost updates, full audit trail forever.</text>
