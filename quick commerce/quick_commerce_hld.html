<line x1="30" y1="704" x2="770" y2="704" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
<text x="400" y="698" text-anchor="middle" font-size="11" font-weight="600" fill="#888">— step 0: serviceability check — the very first gate —</text>

<rect x="40" y="712" width="720" height="128" rx="8" fill="#faeeda" stroke="#ba7517"/>
<text x="400" y="734" text-anchor="middle" font-size="13" font-weight="700" fill="#633806">Is the user's address serviced by a dark store?</text>
<text x="400" y="754" text-anchor="middle" font-size="11" fill="#854f0b">1. User opens app → shares GPS or enters address → geocoded to lat/lng</text>
<text x="400" y="770" text-anchor="middle" font-size="11" fill="#854f0b">2. Redis GEO query: GEORADIUS dark_stores {lat} {lng} 3km → returns nearest dark-store IDs + distances</text>
<text x="400" y="786" text-anchor="middle" font-size="11" fill="#854f0b">3. If result is empty → "We don't deliver here yet" — entire app is gated behind this check</text>
<text x="400" y="802" text-anchor="middle" font-size="11" fill="#854f0b">4. Assigned dark_store_id is cached in user session for all subsequent requests (pin to that store)</text>
<text x="400" y="818" text-anchor="middle" font-size="11" fill="#854f0b">5. All inventory shown and all orders placed are scoped strictly to that ONE dark store's stock</text>
<text x="400" y="834" text-anchor="middle" font-size="10" font-weight="600" fill="#633806">This single pin is why q-commerce can offer 10-min delivery — the supply chain never crosses store boundaries</text>

<line x1="400" y1="840" x2="400" y2="880" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

<!-- ====== SECTION 7: ORDER FLOW — MAIN ====== -->
<line x1="30" y1="868" x2="770" y2="868" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
<text x="400" y="862" text-anchor="middle" font-size="11" font-weight="600" fill="#888">— order placement flow: add to cart → checkout → pay → confirm (the core path) —</text>

<rect x="30" y="880" width="740" height="52" rx="6" fill="#eedefe" stroke="#7f77dd"/>
<text x="400" y="900" text-anchor="middle" font-size="12" font-weight="700" fill="#3c3489">POST /api/orders  { cartId, addressId, paymentMethod, idempotencyKey }</text>
<text x="400" y="916" text-anchor="middle" font-size="11" fill="#534ab7">JWT validated → serviceability re-checked → dispatched to Order Service</text>

<line x1="400" y1="932" x2="400" y2="968" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="80" y="968" width="640" height="228" rx="8" fill="#e1f5ee" stroke="#0f6e56"/>
<text x="400" y="990" text-anchor="middle" font-size="13" font-weight="700" fill="#085041">Order Service — 10-Step Processing Pipeline</text>

<rect x="100" y="1000" width="22" height="22" rx="11" fill="#0f6e56"/>
<text x="111" y="1015" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">1</text>
<text x="133" y="1015" font-size="10" fill="#085041"> Idempotency check: Redis GET idempotency:{key} → if exists, return cached order response (safe retry)</text>

<rect x="100" y="1026" width="22" height="22" rx="11" fill="#0f6e56"/>
<text x="111" y="1041" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">2</text>
<text x="133" y="1041" font-size="10" fill="#085041"> Load cart → re-validate all items still in stock at the assigned dark store (prices may have changed)</text>

<rect x="100" y="1052" width="22" height="22" rx="11" fill="#0f6e56"/>
<text x="111" y="1067" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">3</text>
<text x="133" y="1067" font-size="10" fill="#085041"> HARD inventory reservation: Redis Lua script DECR each item atomically. If any item fails → release all, return 409</text>

<rect x="100" y="1078" width="22" height="22" rx="11" fill="#0f6e56"/>
<text x="111" y="1093" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">4</text>
<text x="133" y="1093" font-size="10" fill="#085041"> Persist order to PostgreSQL: status=PAYMENT_PENDING, reservedAt=now, expiresAt=now+5min</text>

<rect x="100" y="1104" width="22" height="22" rx="11" fill="#0f6e56"/>
<text x="111" y="1119" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">5</text>
<text x="133" y="1119" font-size="10" fill="#085041"> Call Payment Service (Razorpay/Stripe) with idempotency key. Status → PAYMENT_SUCCESS or PAYMENT_FAILED</text>

<rect x="100" y="1130" width="22" height="22" rx="11" fill="#0f6e56"/>
<text x="111" y="1145" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">6</text>
<text x="133" y="1145" font-size="10" fill="#085041"> PAYMENT_FAILED → release all reserved inventory (Redis INCR), order status=CANCELLED, return 402</text>

<rect x="100" y="1156" width="22" height="22" rx="11" fill="#1a8f5c"/>
<text x="111" y="1171" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">7</text>
<text x="133" y="1171" font-size="10" fill="#085041"> PAYMENT_SUCCESS → order status=CONFIRMED. Cache idempotency result. Return 201 { orderId, eta }.</text>

<rect x="100" y="1182" width="22" height="22" rx="11" fill="#0f6e56"/>
<text x="111" y="1197" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">8</text>
<text x="133" y="1197" font-size="10" fill="#085041"> Publish order-confirmed to Kafka → async fan-out: dark store picking queue, rider assignment, notifications</text>

<rect x="100" y="1208" width="22" height="22" rx="11" fill="#0f6e56"/>
<text x="111" y="1223" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">9</text>
<text x="133" y="1223" font-size="10" fill="#085041"> SLA Timer started: Redis EXPIREAT order:sla:{orderId} {now+10min}. Breach → alert ops + compensate user</text>

<rect x="100" y="1234" width="22" height="22" rx="11" fill="#0f6e56"/>
<text x="111" y="1249" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">10</text>
<text x="133" y="1249" font-size="10" fill="#085041"> Dark store app shows picking task. Picker scans items → marks PICKED → triggers rider assignment immediately</text>

<text x="40" y="1178" text-anchor="middle" font-size="10" fill="#993c1d">no charge</text>

<!-- ====== SECTION 8: INVENTORY — ATOMIC DECREMENT ====== -->
<line x1="30" y1="1256" x2="770" y2="1256" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
<text x="400" y="1250" text-anchor="middle" font-size="11" font-weight="600" fill="#888">— inventory: the zero-oversell guarantee (same pattern as flash sales) —</text>

<rect x="30" y="1264" width="740" height="148" rx="8" fill="#faece7" stroke="#993c1d"/>
<text x="400" y="1286" text-anchor="middle" font-size="13" font-weight="700" fill="#712b13">Problem: 200 users add the last bottle of milk to their carts at the same time</text>
<text x="400" y="1306" text-anchor="middle" font-size="11" fill="#993c1d">Without atomicity: all 200 see "in stock" → all 200 place orders → 200 orders for 1 bottle ❌</text>

<text x="400" y="1330" text-anchor="middle" font-size="12" font-weight="700" fill="#712b13">Solution: three-layer inventory guard</text>

<rect x="50"  y="1344" width="210" height="56" rx="6" fill="#fff" stroke="#993c1d"/>
<text x="155" y="1364" text-anchor="middle" font-size="11" font-weight="600" fill="#712b13">Layer 1: Soft check (cart)</text>
<text x="155" y="1380" text-anchor="middle" font-size="10" fill="#993c1d">Redis GET stock:{darkStore}:{sku}</text>
<text x="155" y="1392" text-anchor="middle" font-size="10" fill="#993c1d">Non-blocking, informational only</text>

<rect x="295" y="1344" width="210" height="56" rx="6" fill="#fff" stroke="#993c1d"/>
<text x="400" y="1364" text-anchor="middle" font-size="11" font-weight="600" fill="#712b13">Layer 2: Hard lock (order)</text>
<text x="400" y="1380" text-anchor="middle" font-size="10" fill="#993c1d">Redis Lua: check &gt; 0 → DECR atomic</text>
<text x="400" y="1392" text-anchor="middle" font-size="10" fill="#993c1d">ALL items or none (batch Lua)</text>

<rect x="540" y="1344" width="210" height="56" rx="6" fill="#fff" stroke="#993c1d"/>
<text x="645" y="1364" text-anchor="middle" font-size="11" font-weight="600" fill="#712b13">Layer 3: DB constraint</text>
<text x="645" y="1380" text-anchor="middle" font-size="10" fill="#993c1d">CHECK (quantity &gt;= 0)</text>
<text x="645" y="1392" text-anchor="middle" font-size="10" fill="#993c1d">Last-resort safety net</text>

<line x1="400" y1="1412" x2="400" y2="1452" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

<!-- ====== SECTION 9: DARK STORE + PICKING ====== -->
<line x1="30" y1="1440" x2="770" y2="1440" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
<text x="400" y="1434" text-anchor="middle" font-size="11" font-weight="600" fill="#888">— dark store: the physical fulfillment layer —</text>

<rect x="40" y="1452" width="720" height="128" rx="8" fill="#e1f5ee" stroke="#0f6e56"/>
<text x="400" y="1474" text-anchor="middle" font-size="13" font-weight="700" fill="#085041">Dark Store — Hyperlocal Micro-Warehouse</text>
<text x="400" y="1494" text-anchor="middle" font-size="11" fill="#0f6e56">Inventory organized by zone (dairy, fresh, snacks, beverages) — picker follows shortest path through zones</text>
<text x="400" y="1510" text-anchor="middle" font-size="11" fill="#0f6e56">Picking app shows optimal item sequence → picker scans barcode of each → system confirms quantity match</text>
<text x="400" y="1526" text-anchor="middle" font-size="11" fill="#0f6e56">Picking SLA: all items must be ready in ≤4 minutes of order confirmation (leaves 6 min for delivery)</text>
<text x="400" y="1542" text-anchor="middle" font-size="11" fill="#0f6e56">Substitution flow: if item physically missing despite Redis count, system suggests nearest substitute, notifies user</text>
<text x="400" y="1558" text-anchor="middle" font-size="11" fill="#0f6e56">Restock trigger: when Redis stock:{darkStore}:{sku} &lt; threshold → Kafka: restock-needed → warehouse team alerted</text>
<text x="400" y="1574" text-anchor="middle" font-size="10" font-weight="600" fill="#085041">Items picked → READY state → Delivery Service assigns the nearest available rider immediately</text>

<line x1="400" y1="1580" x2="400" y2="1620" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

<!-- ====== SECTION 10: RIDER ASSIGNMENT ====== -->
<line x1="30" y1="1608" x2="770" y2="1608" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
<text x="400" y="1602" text-anchor="middle" font-size="11" font-weight="600" fill="#888">— rider assignment: finding the right person in under 30 seconds —</text>

<rect x="40" y="1620" width="720" height="120" rx="8" fill="#eedefe" stroke="#7f77dd"/>
<text x="400" y="1642" text-anchor="middle" font-size="13" font-weight="700" fill="#3c3489">Delivery Service — Rider Assignment Steps</text>
<text x="400" y="1662" text-anchor="middle" font-size="11" fill="#534ab7">1. Order PICKED → Delivery Service queries Redis: GEORADIUS riders:{darkStoreId}:available {storeLat} {storeLng} 5km</text>
<text x="400" y="1678" text-anchor="middle" font-size="11" fill="#534ab7">2. Rank candidates: score = distance × load_factor (rider already carrying 1 order = de-prioritized)</text>
<text x="400" y="1694" text-anchor="middle" font-size="11" fill="#534ab7">3. Offer to nearest available rider → 15-second acceptance window. Declined / no response → offer next.</text>
<text x="400" y="1710" text-anchor="middle" font-size="11" fill="#534ab7">4. Accepted: rider status ASSIGNED → Redis: GEOADD riders:{darkStoreId}:busy {lat} {lng} {riderId}</text>
<text x="400" y="1726" text-anchor="middle" font-size="11" fill="#534ab7">5. No rider available in 60s → escalate to zone manager. SLA breach compensation triggered automatically.</text>

<!-- ====== SECTION 15: REQUIREMENTS MAP ====== -->
<line x1="30" y1="2496" x2="770" y2="2496" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>

<rect x="30" y="2504" width="740" height="52" rx="8" fill="#e1f5ee" stroke="#0f6e56"/>
<text x="400" y="2524" text-anchor="middle" font-size="12" font-weight="700" fill="#085041">10-minute delivery promise</text>
<text x="400" y="2542" text-anchor="middle" font-size="11" fill="#0f6e56">Only users within 2–3km of a dark store can order. Picking budget=4min, delivery budget=6min. SLA timer (Redis TTL) fires at 10min — breach triggers automatic compensation coupon and ops alert.</text>

<rect x="30" y="2564" width="740" height="52" rx="8" fill="#e6f1fb" stroke="#185fa5"/>
<text x="400" y="2584" text-anchor="middle" font-size="12" font-weight="700" fill="#0c447c">Real-time inventory accuracy (zero oversell)</text>
<text x="400" y="2602" text-anchor="middle" font-size="11" fill="#185fa5">Stock counter lives in Redis. Cart shows a soft check (may be stale). Order placement executes a Lua atomic DECR — all items succeed or all are rolled back. DB has CHECK(qty &gt;= 0) as a final guard.</text>

<rect x="30" y="2624" width="740" height="52" rx="8" fill="#faeeda" stroke="#ba7517"/>
<text x="400" y="2644" text-anchor="middle" font-size="12" font-weight="700" fill="#633806">Hyperlocal catalog (different stores have different SKUs)</text>
<text x="400" y="2662" text-anchor="middle" font-size="11" fill="#854f0b">Every user is pinned to exactly one dark store at session start. Catalog queries, inventory checks, and order placement are all scoped to that store's ID — users in different localities see different products and stock levels.</text>

<rect x="30" y="2684" width="740" height="52" rx="8" fill="#eedefe" stroke="#7f77dd"/>
<text x="400" y="2704" text-anchor="middle" font-size="12" font-weight="700" fill="#3c3489">Live rider tracking</text>
<text x="400" y="2722" text-anchor="middle" font-size="11" fill="#534ab7">Rider app pings GPS every 3s → Redis GEO updated → Redis pub/sub pushes to WS server → customer sees smooth map movement. ETA recomputed on each ping using Haversine distance / avg speed.</text>

<rect x="30" y="2744" width="740" height="52" rx="8" fill="#faece7" stroke="#993c1d"/>
<text x="400" y="2764" text-anchor="middle" font-size="12" font-weight="700" fill="#712b13">Rider assignment in under 30 seconds</text>
<text x="400" y="2782" text-anchor="middle" font-size="11" fill="#993c1d">GEORADIUS on a live rider GEO set gives nearest available riders in O(N+log M) time. Waterfall offers (nearest first, 15s window each) prevent long waits. Batch-order riders for peak efficiency.</text>

<rect x="30" y="2804" width="740" height="52" rx="8" fill="#e1f5ee" stroke="#0f6e56"/>
<text x="400" y="2824" text-anchor="middle" font-size="12" font-weight="700" fill="#085041">Safe payment + no double charge on retry</text>
<text x="400" y="2842" text-anchor="middle" font-size="11" fill="#0f6e56">Idempotency key (client-generated UUID) on every payment call. Order recorded as PAYMENT_PENDING before gateway call — never lose a payment attempt. Inventory released immediately on failure or timeout.</text>

<rect x="30" y="2864" width="740" height="52" rx="8" fill="#e6f1fb" stroke="#185fa5"/>
<text x="400" y="2884" text-anchor="middle" font-size="12" font-weight="700" fill="#0c447c">Handle traffic spikes (dinner rush, flash deals)</text>
<text x="400" y="2902" text-anchor="middle" font-size="11" fill="#185fa5">Stateless API pods auto-scale (AWS ASG). Load balancer pre-warmed before predicted peaks. Circuit breaker on Payment Service prevents cascade. Kafka decouples order write from all downstream processing load.</text>

<!-- FINAL -->
<rect x="30" y="2932" width="740" height="64" rx="8" fill="#2c2c2a"/>
<text x="400" y="2956" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Q-commerce is a constraint-satisfaction problem: 10-min clock, 2-km radius, fixed store inventory.</text>
<text x="400" y="2976" text-anchor="middle" font-size="11" fill="#aaa">Serviceability pin at session start solves the scope problem. Redis Lua DECR solves the oversell problem.</text>
<text x="400" y="2992" text-anchor="middle" font-size="11" fill="#aaa">GEORADIUS on live rider GEO solves the assignment problem. Everything else is bookkeeping around those three.</text>
