<text x="400" y="852" text-anchor="middle" font-size="12" font-weight="700" fill="#3c3489">POST /api/transfers  { fromWalletId, toWalletId, amount, currency, idempotencyKey }</text>
<text x="400" y="868" text-anchor="middle" font-size="11" fill="#534ab7">JWT validated · KYC gate passed · dispatched to Transfer Service</text>

<line x1="400" y1="884" x2="400" y2="920" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

<text x="400" y="942" text-anchor="middle" font-size="13" font-weight="700" fill="#085041">Transfer Service — Processing Steps</text>
<text x="400" y="960" text-anchor="middle" font-size="11" fill="#0f6e56">1. Idempotency check: Redis GET idempotency:{key} — if exists return cached result</text>
<text x="400" y="976" text-anchor="middle" font-size="11" fill="#0f6e56">2. Validate: both wallets ACTIVE + KYC VERIFIED, from ≠ to, amount > 0</text>
<text x="400" y="992" text-anchor="middle" font-size="11" fill="#0f6e56">3. Fraud check: velocity + amount rules → HIGH risk → PENDING_REVIEW, block</text>
<text x="400" y="1008" text-anchor="middle" font-size="11" fill="#0f6e56">4. Currency conversion (if cross-currency): fetch rate → compute toAmount + fee</text>
<text x="400" y="1024" text-anchor="middle" font-size="11" fill="#0f6e56">5. Acquire distributed locks: Redis SET NX lock:wallet:{from} AND lock:wallet:{to}</text>
<text x="400" y="1040" text-anchor="middle" font-size="11" fill="#0f6e56">6. DB transaction: record txn INITIATED → debit sender → credit receiver → COMPLETED</text>
<text x="400" y="1056" text-anchor="middle" font-size="11" fill="#0f6e56">7. Release locks · update Redis balance cache · cache idempotency result (TTL 24hr)</text>
<text x="400" y="1072" text-anchor="middle" font-size="11" fill="#0f6e56">8. Publish txn-completed to Kafka → async: notify + audit + analytics + statement</text>
<text x="400" y="1084" text-anchor="middle" font-size="11" fill="#0f6e56">9. Return 200 { txnRef, status: COMPLETED, newBalance }</text>

<!-- ====== SECTION 8: CONCURRENCY SAFETY ====== -->
<line x1="30" y1="1388" x2="770" y2="1388" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
<text x="400" y="1381" text-anchor="middle" font-size="11" font-weight="600" fill="#888">— concurrency safety (Req 7) — the hardest part in fintech —</text>

<rect x="30" y="1396" width="740" height="148" rx="8" fill="#faece7" stroke="#993c1d"/>
<text x="400" y="1418" text-anchor="middle" font-size="13" font-weight="700" fill="#712b13">Problem: Alice sends to Bob AND Carol simultaneously — balance might go negative</text>
<text x="400" y="1438" text-anchor="middle" font-size="11" fill="#993c1d">Thread A reads balance=₹5000 → Thread B reads balance=₹5000 → both debit ₹4000 → balance goes to ₹1000 twice → sent ₹8000 from ₹5000 ❌</text>

<text x="400" y="1466" text-anchor="middle" font-size="12" font-weight="700" fill="#712b13">Four-layer defence (each one independently sufficient, together bulletproof):</text>

<rect x="50"  y="1476" width="150" height="56" rx="6" fill="#fff" stroke="#993c1d"/>
<text x="125" y="1496" text-anchor="middle" font-size="10" font-weight="600" fill="#712b13">Redis SET NX</text>
<text x="125" y="1512" text-anchor="middle" font-size="10" fill="#993c1d">lock:wallet:{id}</text>
<text x="125" y="1524" text-anchor="middle" font-size="10" fill="#993c1d">TTL=10s per op</text>

<rect x="220" y="1476" width="150" height="56" rx="6" fill="#fff" stroke="#993c1d"/>
<text x="295" y="1496" text-anchor="middle" font-size="10" font-weight="600" fill="#712b13">DB Transaction</text>
<text x="295" y="1512" text-anchor="middle" font-size="10" fill="#993c1d">SELECT FOR UPDATE</text>
<text x="295" y="1524" text-anchor="middle" font-size="10" fill="#993c1d">balance row lock</text>

<rect x="390" y="1476" width="150" height="56" rx="6" fill="#fff" stroke="#993c1d"/>
<text x="465" y="1496" text-anchor="middle" font-size="10" font-weight="600" fill="#712b13">In-Process Lock</text>
<text x="465" y="1512" text-anchor="middle" font-size="10" fill="#993c1d">ReentrantLock</text>
<text x="465" y="1524" text-anchor="middle" font-size="10" fill="#993c1d">fair=true, per wallet</text>

<rect x="560" y="1476" width="180" height="56" rx="6" fill="#fff" stroke="#993c1d"/>
<text x="650" y="1496" text-anchor="middle" font-size="10" font-weight="600" fill="#712b13">Idempotency Key</text>
<text x="650" y="1512" text-anchor="middle" font-size="10" fill="#993c1d">Redis putIfAbsent</text>
<text x="650" y="1524" text-anchor="middle" font-size="10" fill="#993c1d">dedup same request</text>

<!-- ====== SECTION 14: REQUIREMENTS MAP ====== -->
<line x1="30" y1="2636" x2="770" y2="2636" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
<text x="400" y="2629" text-anchor="middle" font-size="11" font-weight="600" fill="#888">— all 8 requirements → design decisions —</text>

<rect x="30" y="2644" width="740" height="48" rx="8" fill="#e1f5ee" stroke="#0f6e56"/>
<text x="400" y="2664" text-anchor="middle" font-size="12" font-weight="700" fill="#085041">Req 1: Create account + manage personal info</text>
<text x="400" y="2682" text-anchor="middle" font-size="11" fill="#0f6e56">POST /api/wallets creates wallet record in PostgreSQL. KYC status = PENDING until documents verified. Until KYC = VERIFIED: top-up allowed, transfers blocked. Profile updates via PATCH /api/users/{id}.</text>

<rect x="30" y="2704" width="740" height="48" rx="8" fill="#e6f1fb" stroke="#185fa5"/>
<text x="400" y="2724" text-anchor="middle" font-size="12" font-weight="700" fill="#0c447c">Req 2: Add / remove payment methods</text>
<text x="400" y="2742" text-anchor="middle" font-size="11" fill="#185fa5">Card PAN never stored — tokenised by PCI vault (Razorpay/Stripe vault). Bank account numbers AES-256 encrypted. POST /api/wallets/{id}/methods to add. DELETE to remove. First method auto-set as default.</text>

<rect x="30" y="2764" width="740" height="48" rx="8" fill="#faeeda" stroke="#ba7517"/>
<text x="400" y="2784" text-anchor="middle" font-size="12" font-weight="700" fill="#633806">Req 3: Fund transfers (wallet→wallet, wallet→external)</text>
<text x="400" y="2802" text-anchor="middle" font-size="11" fill="#854f0b">Idempotency key (client-generated UUID) prevents double-send on retry. Record txn INITIATED before any debit — never lose a transfer attempt. Saga pattern for cross-service: debit → credit → confirm. Reverse (chargeback) always possible.</text>

<rect x="30" y="2824" width="740" height="48" rx="8" fill="#eedefe" stroke="#7f77dd"/>
<text x="400" y="2844" text-anchor="middle" font-size="12" font-weight="700" fill="#3c3489">Req 4: Transaction history + statement</text>
<text x="400" y="2862" text-anchor="middle" font-size="11" fill="#534ab7">Recent 30 days: Redis ZSET keyed by walletId (score=timestamp) — sub-ms reads. Older: Cassandra partitioned by walletId, clustered by timestamp. Cursor-based pagination. Filter by type, status, amount, date range.</text>

<rect x="30" y="2884" width="740" height="48" rx="8" fill="#faece7" stroke="#993c1d"/>
<text x="400" y="2904" text-anchor="middle" font-size="12" font-weight="700" fill="#712b13">Req 5: Multi-currency + conversion</text>
<text x="400" y="2922" text-anchor="middle" font-size="11" fill="#993c1d">All amounts stored in smallest denomination (paise/cents) — zero float error. FX rates cached 60s in Redis. Cross-currency fee 0.5–1.5%. Rate locked at transfer initiation time. Strategy pattern: swap live→fixed for testing.</text>

<rect x="30" y="2944" width="740" height="48" rx="8" fill="#e1f5ee" stroke="#0f6e56"/>
<text x="400" y="2964" text-anchor="middle" font-size="12" font-weight="700" fill="#085041">Req 6: Security</text>
<text x="400" y="2982" text-anchor="middle" font-size="11" fill="#0f6e56">TLS 1.3 everywhere. PCI-DSS card tokenisation. AES-256 bank account encryption. OAuth2+JWT auth. MFA on large transfers. WAF blocks OWASP Top 10. Fraud: velocity + amount rules pre-txn, ML model post-txn. Wallet freeze on HIGH risk.</text>

<rect x="30" y="3004" width="740" height="48" rx="8" fill="#e6f1fb" stroke="#185fa5"/>
<text x="400" y="3024" text-anchor="middle" font-size="12" font-weight="700" fill="#0c447c">Req 7: Concurrent transactions + data consistency</text>
<text x="400" y="3042" text-anchor="middle" font-size="11" fill="#185fa5">Four layers: Redis SET NX (distributed lock, cross-pod) + PostgreSQL SELECT FOR UPDATE (row lock) + ReentrantLock(fair=true) (in-process) + Idempotency key (dedup). Any single layer alone prevents double-spend. All four together are bulletproof.</text>

<rect x="30" y="3064" width="740" height="48" rx="8" fill="#faeeda" stroke="#ba7517"/>
<text x="400" y="3084" text-anchor="middle" font-size="12" font-weight="700" fill="#633806">Req 8: Scalable for large users + transactions</text>
<text x="400" y="3102" text-anchor="middle" font-size="11" fill="#854f0b">Stateless API pods — horizontal scale via auto-scaling groups. Cassandra for transaction history (linear write scale). Kafka for async decoupling. Redis cluster for distributed caching. DB read replicas for statement queries. Sharding by walletId for extreme scale.</text>

<!-- FINAL -->
<rect x="30" y="3124" width="740" height="60" rx="8" fill="#2c2c2a"/>
<text x="400" y="3146" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">The hardest problem in fintech: Alice sends ₹5000 to Bob and Carol simultaneously — balance must never go negative.</text>
<text x="400" y="3166" text-anchor="middle" font-size="11" fill="#aaa">Redis SET NX + PostgreSQL SELECT FOR UPDATE + ReentrantLock(fair) + Idempotency key = zero double-spend, zero lost transfers, zero duplicate debits.</text>
