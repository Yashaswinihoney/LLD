<text x="686" y="1708" text-anchor="middle" font-size="10" fill="#534ab7">crawl-results topic</text>
<text x="686" y="1724" text-anchor="middle" font-size="10" fill="#534ab7">new-urls topic</text>
<text x="686" y="1740" text-anchor="middle" font-size="10" fill="#534ab7">error-events topic</text>
<text x="686" y="1756" text-anchor="middle" font-size="10" fill="#534ab7">replay on failure</text>
<text x="686" y="1772" text-anchor="middle" font-size="10" fill="#534ab7">partitioned by domain</text>
<text x="686" y="1788" text-anchor="middle" font-size="10" fill="#534ab7">Async fan-out</text>

<!-- ====== SECTION 11: URL PRIORITY (FIFO vs RANK) ====== -->
<line x1="30" y1="1880" x2="770" y2="1880" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
<text x="400" y="1872" text-anchor="middle" font-size="11" font-weight="600" fill="#888">— url priority strategies —</text>

<rect x="30"  y="1888" width="228" height="112" rx="8" fill="#e1f5ee" stroke="#0f6e56"/>
<text x="144" y="1910" text-anchor="middle" font-size="12" font-weight="700" fill="#27500a">FIFO</text>
<text x="144" y="1930" text-anchor="middle" font-size="11" fill="#0f6e56">First-discovered first-crawled</text>
<text x="144" y="1946" text-anchor="middle" font-size="11" fill="#0f6e56">Breadth-first traversal</text>
<text x="144" y="1962" text-anchor="middle" font-size="11" fill="#0f6e56">Simple, predictable</text>
<text x="144" y="1978" text-anchor="middle" font-size="11" fill="#0f6e56">Use: small crawls, testing</text>

<rect x="286" y="1888" width="228" height="112" rx="8" fill="#e1f5ee" stroke="#0f6e56"/>
<text x="400" y="1910" text-anchor="middle" font-size="12" font-weight="700" fill="#27500a">Domain Rank</text>
<text x="400" y="1930" text-anchor="middle" font-size="11" fill="#0f6e56">High-authority domains first</text>
<text x="400" y="1946" text-anchor="middle" font-size="11" fill="#0f6e56">PageRank score as weight</text>
<text x="400" y="1962" text-anchor="middle" font-size="11" fill="#0f6e56">Depth penalty applied</text>
<text x="400" y="1978" text-anchor="middle" font-size="11" fill="#0f6e56">Use: search engine crawl</text>

<rect x="542" y="1888" width="228" height="112" rx="8" fill="#e1f5ee" stroke="#0f6e56"/>
<text x="656" y="1910" text-anchor="middle" font-size="12" font-weight="700" fill="#27500a">Freshness</text>
<text x="656" y="1930" text-anchor="middle" font-size="11" fill="#0f6e56">Re-crawl recently updated</text>
<text x="656" y="1946" text-anchor="middle" font-size="11" fill="#0f6e56">Use Last-Modified header</text>
<text x="656" y="1962" text-anchor="middle" font-size="11" fill="#0f6e56">Higher freq for news sites</text>
<text x="656" y="1978" text-anchor="middle" font-size="11" fill="#0f6e56">Use: re-crawl scheduler</text>

<!-- ====== SECTION 12: 5 KEY DECISIONS ====== -->
<line x1="30" y1="2064" x2="770" y2="2064" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
<text x="400" y="2056" text-anchor="middle" font-size="11" font-weight="600" fill="#888">— 5 hardest design decisions —</text>

<rect x="30" y="2072" width="740" height="52" rx="8" fill="#e1f5ee" stroke="#0f6e56"/>
<text x="400" y="2092" text-anchor="middle" font-size="12" font-weight="700" fill="#085041">1. Bloom filter for URL dedup — not HashSet</text>
<text x="400" y="2110" text-anchor="middle" font-size="11" fill="#0f6e56">At 1 billion URLs: HashSet needs ~64GB RAM. Bloom filter needs ~1.2GB for 1% false-positive rate. Occasional re-crawl of a seen URL is a perfectly acceptable trade-off. In-memory Bloom filter in Redis, shared across all crawler workers.</text>

<rect x="30" y="2136" width="740" height="52" rx="8" fill="#e6f1fb" stroke="#185fa5"/>
<text x="400" y="2156" text-anchor="middle" font-size="12" font-weight="700" fill="#0c447c">2. Per-domain back queues — politeness without blocking all workers</text>
<text x="400" y="2174" text-anchor="middle" font-size="11" fill="#185fa5">Without domain queues: all workers pile up on the same domain (hammering google.com). With domain queues: each domain has its own FIFO queue. Workers pick from different domains in rotation. One domain is never crawled by 2 workers simultaneously.</text>

<rect x="30" y="2200" width="740" height="52" rx="8" fill="#faeeda" stroke="#ba7517"/>
<text x="400" y="2220" text-anchor="middle" font-size="12" font-weight="700" fill="#633806">3. DNS caching prevents bottleneck at scale</text>
<text x="400" y="2238" text-anchor="middle" font-size="11" fill="#854f0b">Without DNS cache: 10 million pages/hour = 10M DNS lookups/hour. DNS resolver becomes a bottleneck. Solution: maintain in-process DNS cache with TTL (typically 300s). At 3 workers per machine × 100 machines = 300 workers sharing one DNS cache.</text>

<rect x="30" y="2264" width="740" height="52" rx="8" fill="#eedefe" stroke="#7f77dd"/>
<text x="400" y="2284" text-anchor="middle" font-size="12" font-weight="700" fill="#3c3489">4. CDN detection — crawler fetches from edge, not origin</text>
<text x="400" y="2302" text-anchor="middle" font-size="11" fill="#534ab7">When target site uses CDN (Cloudflare/Akamai), DNS resolves to edge IP. Crawler actually talks to the CDN edge node, which may serve cached content. CDN may return 429 if crawl rate is too high — crawler must respect Retry-After and back off per domain.</text>

<rect x="30" y="2328" width="740" height="52" rx="8" fill="#faece7" stroke="#993c1d"/>
<text x="400" y="2348" text-anchor="middle" font-size="12" font-weight="700" fill="#712b13">5. Kafka partitioned by domain — all pages from one domain in one partition</text>
<text x="400" y="2366" text-anchor="middle" font-size="11" fill="#993c1d">Partitioning crawl-results by domain ensures the indexer processes all pages of a domain in order (important for link graph consistency). New-urls topic partitioned by domain so politeness logic is isolated per partition consumer.</text>

<!-- LLD vs HLD -->
<line x1="30" y1="2444" x2="770" y2="2444" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
<text x="400" y="2436" text-anchor="middle" font-size="11" font-weight="600" fill="#888">— LLD vs HLD comparison —</text>

<rect x="30"  y="2452" width="352" height="188" rx="8" fill="#f1efe8" stroke="#888780"/>
<text x="206" y="2474" text-anchor="middle" font-size="12" font-weight="700" fill="#2c2c2a">LLD (In-Process)</text>
<text x="206" y="2494" text-anchor="middle" font-size="11" fill="#5f5e5a">URL dedup: ConcurrentHashMap.newKeySet()</text>
<text x="206" y="2510" text-anchor="middle" font-size="11" fill="#5f5e5a">Frontier: PriorityBlockingQueue</text>
<text x="206" y="2526" text-anchor="middle" font-size="11" fill="#5f5e5a">Workers: ExecutorService threads</text>
<text x="206" y="2542" text-anchor="middle" font-size="11" fill="#5f5e5a">Storage: in-memory list (IndexerObserver)</text>
<text x="206" y="2558" text-anchor="middle" font-size="11" fill="#5f5e5a">DNS: System default resolver</text>
<text x="206" y="2574" text-anchor="middle" font-size="11" fill="#5f5e5a">CDN: transparent (no special handling)</text>
<text x="206" y="2590" text-anchor="middle" font-size="11" fill="#5f5e5a">Fingerprint: MD5 HashMap</text>
<text x="206" y="2610" text-anchor="middle" font-size="11" fill="#5f5e5a">Observers: synchronous calls</text>
<text x="206" y="2630" text-anchor="middle" font-size="11" fill="#5f5e5a">Scale: single machine, ~10K pages</text>

<rect x="418" y="2452" width="352" height="188" rx="8" fill="#e1f5ee" stroke="#0f6e56"/>
<text x="594" y="2474" text-anchor="middle" font-size="12" font-weight="700" fill="#085041">HLD (Distributed)</text>
<text x="594" y="2494" text-anchor="middle" font-size="11" fill="#0f6e56">URL dedup: Redis Bloom filter (shared)</text>
<text x="594" y="2510" text-anchor="middle" font-size="11" fill="#0f6e56">Frontier: Kafka + Redis sorted sets</text>
<text x="594" y="2526" text-anchor="middle" font-size="11" fill="#0f6e56">Workers: 1000s of machines in datacenter</text>
<text x="594" y="2542" text-anchor="middle" font-size="11" fill="#0f6e56">Storage: S3 (HTML) + Elasticsearch (index)</text>
<text x="594" y="2558" text-anchor="middle" font-size="11" fill="#0f6e56">DNS: in-process TTL cache per worker</text>
<text x="594" y="2574" text-anchor="middle" font-size="11" fill="#0f6e56">CDN: detect + respect 429 + back off</text>
<text x="594" y="2590" text-anchor="middle" font-size="11" fill="#0f6e56">Fingerprint: SimHash in Redis</text>
<text x="594" y="2610" text-anchor="middle" font-size="11" fill="#0f6e56">Observers: Kafka async fan-out</text>
<text x="594" y="2630" text-anchor="middle" font-size="11" fill="#0f6e56">Scale: 1B+ pages/day (Google Googlebot)</text>

<!-- FINAL -->
<rect x="30" y="2660" width="740" height="60" rx="8" fill="#2c2c2a"/>
<text x="400" y="2682" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Googlebot crawls ~15 billion pages per day. The bottleneck is never bandwidth — it's politeness and DNS.</text>
<text x="400" y="2702" text-anchor="middle" font-size="11" fill="#aaa">Every design decision in a crawler traces back to one constraint: don't be a bad citizen to the sites you crawl.</text>
