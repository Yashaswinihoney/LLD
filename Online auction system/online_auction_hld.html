<line x1="400" y1="856" x2="400" y2="892" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

<text x="400" y="914" text-anchor="middle" font-size="13" font-weight="700" fill="#085041">Bid Service — Processing Steps</text>
<text x="400" y="932" text-anchor="middle" font-size="11" fill="#0f6e56">1. Validate user: active, trust score ≥ 20, not the seller</text>
<text x="400" y="948" text-anchor="middle" font-size="11" fill="#0f6e56">2. Idempotency: Redis check — duplicate bid prevention</text>
<text x="400" y="964" text-anchor="middle" font-size="11" fill="#0f6e56">3. Strategy validation: fund check, min-increment check</text>
<text x="400" y="980" text-anchor="middle" font-size="11" fill="#0f6e56">4. Acquire per-auction distributed lock (Redis SET NX TTL=5s)</text>
<text x="400" y="996" text-anchor="middle" font-size="11" fill="#0f6e56">5. Re-check: bid > currentHighBid AND auction still active</text>
<text x="400" y="1012" text-anchor="middle" font-size="11" fill="#0f6e56">6. Reserve bidder funds in wallet (atomic deduct)</text>
<text x="400" y="1028" text-anchor="middle" font-size="11" fill="#0f6e56">7. Persist bid + update currentHighBid in DB (transaction)</text>
<text x="400" y="1044" text-anchor="middle" font-size="11" fill="#0f6e56">8. Release previous leader's reserved funds · release lock</text>
<text x="400" y="1052" text-anchor="middle" font-size="11" fill="#0f6e56">9. Publish bid-placed event to Kafka → real-time fan-out</text>

<!-- ====== SECTION 7: CONCURRENCY ====== -->
<line x1="30" y1="1320" x2="770" y2="1320" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
<text x="400" y="1313" text-anchor="middle" font-size="11" font-weight="600" fill="#888">— concurrency safety (Req 7) —</text>

<rect x="30" y="1328" width="740" height="148" rx="8" fill="#faece7" stroke="#993c1d"/>
<text x="400" y="1350" text-anchor="middle" font-size="13" font-weight="700" fill="#712b13">Problem: Alice and Bob bid simultaneously on the same auction</text>
<text x="400" y="1370" text-anchor="middle" font-size="11" fill="#993c1d">Without locking: both read currentHighBid=₹5000 → both send ₹5500 → both accepted → duplicate high bids ❌</text>

<text x="400" y="1398" text-anchor="middle" font-size="12" font-weight="700" fill="#712b13">Three-layer concurrency guarantee:</text>

<rect x="50"  y="1408" width="200" height="56" rx="6" fill="#fff" stroke="#993c1d"/>
<text x="150" y="1428" text-anchor="middle" font-size="11" font-weight="600" fill="#712b13">Layer 1: Redis SET NX</text>
<text x="150" y="1444" text-anchor="middle" font-size="10" fill="#993c1d">lock:auction-501 TTL=5s</text>
<text x="150" y="1458" text-anchor="middle" font-size="10" fill="#993c1d">Only one server processes</text>

<rect x="300" y="1408" width="200" height="56" rx="6" fill="#fff" stroke="#993c1d"/>
<text x="400" y="1428" text-anchor="middle" font-size="11" font-weight="600" fill="#712b13">Layer 2: DB Transaction</text>
<text x="400" y="1444" text-anchor="middle" font-size="10" fill="#993c1d">SELECT FOR UPDATE</text>
<text x="400" y="1458" text-anchor="middle" font-size="10" fill="#993c1d">Pessimistic row lock</text>

<rect x="550" y="1408" width="200" height="56" rx="6" fill="#fff" stroke="#993c1d"/>
<text x="650" y="1428" text-anchor="middle" font-size="11" font-weight="600" fill="#712b13">Layer 3: In-Process Lock</text>
<text x="650" y="1444" text-anchor="middle" font-size="10" fill="#993c1d">ReentrantLock(fair=true)</text>
<text x="650" y="1458" text-anchor="middle" font-size="10" fill="#993c1d">FIFO ordering on pod</text>

<rect x="160" y="1552" width="480" height="112" rx="8" fill="#eedefe" stroke="#7f77dd"/>
<text x="400" y="1574" text-anchor="middle" font-size="13" font-weight="700" fill="#3c3489">WebSocket Live Bidding</text>
<text x="400" y="1592" text-anchor="middle" font-size="11" fill="#534ab7">All users watching an auction subscribe: WS /ws/auction/{id}</text>
<text x="400" y="1608" text-anchor="middle" font-size="11" fill="#534ab7">WS server joins Redis pub/sub channel: auction:{id}</text>
<text x="400" y="1624" text-anchor="middle" font-size="11" fill="#534ab7">On new bid: Kafka consumer publishes to Redis channel</text>
<text x="400" y="1640" text-anchor="middle" font-size="11" fill="#534ab7">WS servers push to all connected clients: { newHighBid, bidder, timestamp }</text>
<text x="400" y="1656" text-anchor="middle" font-size="11" fill="#534ab7">Bid count, countdown timer, "X people watching" all update live</text>
<text x="400" y="1664" text-anchor="middle" font-size="11" fill="#534ab7">Outbid user receives targeted push notification within &lt;500ms</text>

<!-- ====== SECTION 9: AUCTION CLOSE FLOW ====== -->
<line x1="30" y1="1736" x2="770" y2="1736" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
<text x="400" y="1729" text-anchor="middle" font-size="11" font-weight="600" fill="#888">— auction close + winner flow (Req 6) —</text>

<rect x="30"  y="1744" width="350" height="128" rx="8" fill="#faeeda" stroke="#ba7517"/>
<text x="205" y="1766" text-anchor="middle" font-size="12" font-weight="700" fill="#633806">Auction Timer Service</text>
<text x="205" y="1786" text-anchor="middle" font-size="11" fill="#854f0b">Auction created → delayed job scheduled</text>
<text x="205" y="1802" text-anchor="middle" font-size="11" fill="#854f0b">Redis: EXPIREAT auction:501:end {endTimestamp}</text>
<text x="205" y="1818" text-anchor="middle" font-size="11" fill="#854f0b">Key expiry triggers keyspace notification</text>
<text x="205" y="1834" text-anchor="middle" font-size="11" fill="#854f0b">Auction Close Worker picks up + processes</text>
<text x="205" y="1850" text-anchor="middle" font-size="11" fill="#854f0b">Fallback: cron job every 1 min for missed timers</text>
<text x="205" y="1866" text-anchor="middle" font-size="11" fill="#854f0b">Idempotent: double-close is a no-op</text>

<rect x="420" y="1744" width="350" height="128" rx="8" fill="#eaf3de" stroke="#3b6d11"/>
<text x="595" y="1766" text-anchor="middle" font-size="12" font-weight="700" fill="#27500a">Winner Declaration</text>
<text x="595" y="1786" text-anchor="middle" font-size="11" fill="#3b6d11">Fetch leading bid from DB</text>
<text x="595" y="1802" text-anchor="middle" font-size="11" fill="#3b6d11">Check reserve price (if applicable)</text>
<text x="595" y="1818" text-anchor="middle" font-size="11" fill="#3b6d11">Mark auction ENDED in DB</text>
<text x="595" y="1834" text-anchor="middle" font-size="11" fill="#3b6d11">Deduct winning bid from wallet (finalize)</text>

<!-- ====== SECTION 12: REQUIREMENTS MAP ====== -->
<line x1="30" y1="2460" x2="770" y2="2460" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
<text x="400" y="2453" text-anchor="middle" font-size="11" font-weight="600" fill="#888">— all 8 requirements → design decisions —</text>

<rect x="30" y="2468" width="740" height="48" rx="8" fill="#e1f5ee" stroke="#0f6e56"/>
<text x="400" y="2488" text-anchor="middle" font-size="12" font-weight="700" fill="#085041">Req 1: Register + Login</text>
<text x="400" y="2506" text-anchor="middle" font-size="11" fill="#0f6e56">BCrypt password hash (never plaintext). JWT token issued on login (expiry 24hr). Refresh token for mobile. Duplicate email check in UserRegistry. Suspended users blocked at Auth Service.</text>

<rect x="30" y="2528" width="740" height="48" rx="8" fill="#e6f1fb" stroke="#185fa5"/>
<text x="400" y="2548" text-anchor="middle" font-size="12" font-weight="700" fill="#0c447c">Req 2: Create auction listing</text>
<text x="400" y="2566" text-anchor="middle" font-size="11" fill="#185fa5">POST /auctions with itemName, description, startingPrice, durationMinutes, category. Persisted to PostgreSQL. Timer scheduled via Redis EXPIREAT. Synced to Elasticsearch for search. Images uploaded to S3 via presigned URL.</text>

<rect x="30" y="2588" width="740" height="48" rx="8" fill="#faeeda" stroke="#ba7517"/>
<text x="400" y="2608" text-anchor="middle" font-size="12" font-weight="700" fill="#633806">Req 3: Browse + search by name, category, price range</text>
<text x="400" y="2626" text-anchor="middle" font-size="11" fill="#854f0b">Elasticsearch for full-text name search. Faceted filters for category + price. Results cached Redis 30s. Current bid price always fresh from Redis (never cached — changes every second during bidding).</text>

<rect x="30" y="2648" width="740" height="48" rx="8" fill="#eedefe" stroke="#7f77dd"/>
<text x="400" y="2668" text-anchor="middle" font-size="12" font-weight="700" fill="#3c3489">Req 4 + 5: Place bids + auto-update highest bid + notify outbid</text>
<text x="400" y="2686" text-anchor="middle" font-size="11" fill="#534ab7">Redis SET NX lock per auction. Atomic DB transaction. Kafka bid-events → WS push to all watchers (&lt;200ms). Outbid user gets targeted push/email via Notification Service. Fund reservation/release atomic.</text>

<rect x="30" y="2708" width="740" height="48" rx="8" fill="#faece7" stroke="#993c1d"/>
<text x="400" y="2728" text-anchor="middle" font-size="12" font-weight="700" fill="#712b13">Req 6: Auction ends at duration → winner declared</text>
<text x="400" y="2746" text-anchor="middle" font-size="11" fill="#993c1d">Redis EXPIREAT triggers keyspace notification → Auction Close Worker. Idempotent (can run twice safely). Reserve price checked. Winner notified + charged. All others refunded. Kafka auction-ended published.</text>

<rect x="30" y="2768" width="740" height="48" rx="8" fill="#e1f5ee" stroke="#0f6e56"/>
<text x="400" y="2788" text-anchor="middle" font-size="12" font-weight="700" fill="#085041">Req 7: Concurrent access + data consistency</text>
<text x="400" y="2806" text-anchor="middle" font-size="11" fill="#0f6e56">3-layer lock: Redis SET NX (distributed) + PostgreSQL SELECT FOR UPDATE + ReentrantLock(fair=true) in-process. Together: zero double-bids possible across any number of servers or threads.</text>

<rect x="30" y="2828" width="740" height="48" rx="8" fill="#e6f1fb" stroke="#185fa5"/>
<text x="400" y="2848" text-anchor="middle" font-size="12" font-weight="700" fill="#0c447c">Req 8: Extensible design</text>
<text x="400" y="2866" text-anchor="middle" font-size="11" fill="#185fa5">Strategy: add Dutch auction validation without touching Bid Service. Observer: add new notification channel (WhatsApp) without changing auction logic. Factory: add sealed-bid auction type in one class. Zero core changes needed.</text>

<!-- FINAL -->
<rect x="30" y="2892" width="740" height="60" rx="8" fill="#2c2c2a"/>
<text x="400" y="2914" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">The hardest problem: 1000 users bidding on the same item in the final 30 seconds.</text>
<text x="400" y="2934" text-anchor="middle" font-size="11" fill="#aaa">Redis SET NX (distributed lock) + SELECT FOR UPDATE (DB) + ReentrantLock(fair=true) = exactly one winner, zero double-bids, FIFO fairness.</text>
