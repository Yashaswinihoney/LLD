<!-- ====== SECTION 9: KEY DESIGN RULES ====== -->
<line x1="30" y1="1876" x2="730" y2="1876" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
<text x="380" y="1868" text-anchor="middle" font-size="11" font-weight="600" fill="#888">— 4 key design rules (say these in every interview) —</text>

<rect x="30" y="1884" width="700" height="52" rx="8" fill="#e1f5ee" stroke="#0f6e56"/>
<text x="380" y="1904" text-anchor="middle" font-size="12" font-weight="700" fill="#085041">1. Always start in RED — the safe state</text>
<text x="380" y="1922" text-anchor="middle" font-size="11" fill="#0f6e56">Every light initialises to RED on power-up, restart, or fault recovery. Never GREEN. A light that fails must default to FLASHING_RED (4-way stop), never go dark.</text>

<rect x="30" y="1948" width="700" height="52" rx="8" fill="#e6f1fb" stroke="#185fa5"/>
<text x="380" y="1968" text-anchor="middle" font-size="12" font-weight="700" fill="#0c447c">2. All-red clearance between phases (prevents crossing collisions)</text>
<text x="380" y="1986" text-anchor="middle" font-size="11" fill="#185fa5">Between every phase transition there is a 2-second all-red window. NS yellow → 2s all-red → EW green. This ensures vehicles from the previous green phase have cleared the intersection.</text>

<rect x="30" y="2012" width="700" height="52" rx="8" fill="#faeeda" stroke="#ba7517"/>
<text x="380" y="2032" text-anchor="middle" font-size="12" font-weight="700" fill="#633806">3. Emergency command stores previous state for rollback</text>
<text x="380" y="2050" text-anchor="middle" font-size="11" fill="#854f0b">Before overriding, snapshot current colors into a Map. After emergency clears, rollback() restores the snapshot and resumes the cycle. Without this, the intersection stays frozen in emergency state.</text>

<rect x="30" y="2076" width="700" height="52" rx="8" fill="#eedefe" stroke="#7f77dd"/>
<text x="380" y="2096" text-anchor="middle" font-size="12" font-weight="700" fill="#3c3489">4. One scheduler thread per intersection (no shared lock needed)</text>
<text x="380" y="2114" text-anchor="middle" font-size="11" fill="#534ab7">Each intersection has a single-thread ScheduledExecutorService. No two transitions run concurrently on the same intersection — no race conditions, no synchronized blocks needed on the cycle itself.</text>

<!-- LLD vs HLD -->
<line x1="30" y1="2192" x2="730" y2="2192" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
<text x="380" y="2184" text-anchor="middle" font-size="11" font-weight="600" fill="#888">— LLD vs HLD comparison —</text>

<rect x="30"  y="2200" width="340" height="164" rx="8" fill="#f1efe8" stroke="#888780"/>
<text x="200" y="2222" text-anchor="middle" font-size="12" font-weight="700" fill="#2c2c2a">LLD (In-Process)</text>
<text x="200" y="2242" text-anchor="middle" font-size="11" fill="#5f5e5a">State: boolean/enum fields on TrafficLight</text>
<text x="200" y="2258" text-anchor="middle" font-size="11" fill="#5f5e5a">Cycle: ScheduledExecutorService</text>
<text x="200" y="2274" text-anchor="middle" font-size="11" fill="#5f5e5a">Emergency: in-process Command object</text>
<text x="200" y="2290" text-anchor="middle" font-size="11" fill="#5f5e5a">Fault: CoR method chain in-process</text>
<text x="200" y="2306" text-anchor="middle" font-size="11" fill="#5f5e5a">Observers: synchronous method calls</text>
<text x="200" y="2322" text-anchor="middle" font-size="11" fill="#5f5e5a">TCC: singleton in same JVM</text>
<text x="200" y="2342" text-anchor="middle" font-size="11" fill="#5f5e5a">Timing: simple sleep() calls</text>

<rect x="390" y="2200" width="340" height="164" rx="8" fill="#e1f5ee" stroke="#0f6e56"/>
<text x="560" y="2222" text-anchor="middle" font-size="12" font-weight="700" fill="#085041">HLD (Distributed)</text>
<text x="560" y="2242" text-anchor="middle" font-size="11" fill="#0f6e56">State: Redis key per light (TTL = phase duration)</text>
<text x="560" y="2258" text-anchor="middle" font-size="11" fill="#0f6e56">Cycle: controller hardware + embedded OS</text>
<text x="560" y="2274" text-anchor="middle" font-size="11" fill="#0f6e56">Emergency: REST API call to TCC</text>
<text x="560" y="2290" text-anchor="middle" font-size="11" fill="#0f6e56">Fault: alert pushed via Kafka to TCC</text>
<text x="560" y="2306" text-anchor="middle" font-size="11" fill="#0f6e56">Observers: Kafka async to dashboard</text>
<text x="560" y="2322" text-anchor="middle" font-size="11" fill="#0f6e56">TCC: central server, intersections as clients</text>
<text x="560" y="2342" text-anchor="middle" font-size="11" fill="#0f6e56">Timing: hardware timer + NTP-synced clock</text>

<!-- FINAL -->
<rect x="30" y="2384" width="700" height="52" rx="8" fill="#2c2c2a"/>
<text x="380" y="2406" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">The entire system reduces to one rule: one direction gets GREEN at a time, all others are RED.</text>
<text x="380" y="2424" text-anchor="middle" font-size="11" fill="#aaa">Every pattern — State, Command, CoR, Strategy, Observer — exists to manage transitions to and from that one green safely.</text>
