<!-- concurrent scenario -->
<text x="390" y="960" text-anchor="middle" font-size="11" fill="#5f5e5a">Alice and Bob both try to book Seat A-1 at the same moment:</text>

<rect x="70"  y="972" width="290" height="60" rx="6" fill="#eaf3de" stroke="#3b6d11"/>
<text x="215" y="994" text-anchor="middle" font-size="11" font-weight="600" fill="#27500a">Alice's Thread ✓</text>
<text x="215" y="1012" text-anchor="middle" font-size="11" fill="#3b6d11">Redis SET NX seat:A-1 "alice" EX 600</text>
<text x="215" y="1028" text-anchor="middle" font-size="11" fill="#3b6d11">Returns OK → seat LOCKED for Alice</text>

<rect x="430" y="972" width="290" height="60" rx="6" fill="#faece7" stroke="#993c1d"/>
<text x="575" y="994" text-anchor="middle" font-size="11" font-weight="600" fill="#712b13">Bob's Thread ✗</text>
<text x="575" y="1012" text-anchor="middle" font-size="11" fill="#993c1d">Redis SET NX seat:A-1 "bob" EX 600</text>
<text x="575" y="1028" text-anchor="middle" font-size="11" fill="#993c1d">Returns NIL → seat already locked</text>

<text x="390" y="1060" text-anchor="middle" font-size="11" fill="#5f5e5a">All-or-nothing: if any seat in batch fails lock → ALL locks released immediately</text>
<text x="390" y="1076" text-anchor="middle" font-size="11" fill="#5f5e5a">TTL expiry (10 min): if Alice abandons payment → Redis key expires → seat freed</text>
<text x="390" y="1092" text-anchor="middle" font-size="11" fill="#5f5e5a">Fairness (Req 5): high-demand concerts use a virtual queue — users assigned position</text>
<text x="390" y="1108" text-anchor="middle" font-size="11" fill="#5f5e5a">number and served in order (SQS FIFO / Redis sorted set by enqueue timestamp)</text>
<text x="390" y="1124" text-anchor="middle" font-size="11" fill="#5f5e5a">Record txn as INITIATED in DB before calling gateway (never lose a booking attempt)</text>

<text x="400" y="1270" text-anchor="middle" font-size="13" font-weight="700" fill="#0c447c">Payment Service (Secure — PCI-DSS)</text>
<text x="400" y="1288" text-anchor="middle" font-size="11" fill="#185fa5">1. Persist txn as INITIATED before calling gateway (never lose attempt)</text>
<text x="400" y="1304" text-anchor="middle" font-size="11" fill="#185fa5">2. Idempotency key: "booking-{id}" → same key = same result, no double charge</text>
<text x="400" y="1320" text-anchor="middle" font-size="11" fill="#185fa5">3. Call Razorpay / Stripe / PhonePe API (UPI / Card / Wallet / Net Banking)</text>
<text x="400" y="1336" text-anchor="middle" font-size="11" fill="#185fa5">4. Payment result via webhook (async) — verify HMAC signature before trusting</text>
<text x="400" y="1352" text-anchor="middle" font-size="11" fill="#185fa5">5. SUCCESS: mark seats BOOKED, txn CONFIRMED → publish to Kafka</text>
<text x="400" y="1368" text-anchor="middle" font-size="11" fill="#185fa5">6. FAILURE: release seat locks → txn FAILED → notify user</text>

<text x="205" y="1818" text-anchor="middle" font-size="11" fill="#993c1d">All seats BOOKED → availableCount = 0</text>

<rect x="30" y="2396" width="740" height="52" rx="8" fill="#e1f5ee" stroke="#0f6e56"/>
<text x="400" y="2416" text-anchor="middle" font-size="12" font-weight="700" fill="#085041">Req 1 + 2: View concerts + search</text>
<text x="400" y="2434" text-anchor="middle" font-size="11" fill="#0f6e56">Concert Service reads from PostgreSQL. CDN caches listing pages (TTL 5min). Elasticsearch handles full-text search (artist, venue, city, date). Available seat count served from Redis (always fresh).</text>

<rect x="30" y="2460" width="740" height="52" rx="8" fill="#e6f1fb" stroke="#185fa5"/>
<text x="400" y="2480" text-anchor="middle" font-size="12" font-weight="700" fill="#0c447c">Req 3 + 4: Select seats + no double-booking</text>
<text x="400" y="2498" text-anchor="middle" font-size="11" fill="#185fa5">Redis SET NX per seat (atomic, single-server guarantee). All-or-nothing batch lock. TTL=10min auto-release if payment abandoned. Per-seat ReentrantLock in Booking Service for in-process safety.</text>

<rect x="30" y="2524" width="740" height="52" rx="8" fill="#faeeda" stroke="#ba7517"/>
<text x="400" y="2544" text-anchor="middle" font-size="12" font-weight="700" fill="#633806">Req 5: Fair booking — virtual queue for high demand</text>
<text x="400" y="2562" text-anchor="middle" font-size="11" fill="#854f0b">Redis sorted set: score = enqueue timestamp. ZADD queue:concert-id timestamp userId. ZPOPMIN to dequeue next user. Position shown in UI: ZRANK. First come, first served. No random seat grabs.</text>

<rect x="30" y="2588" width="740" height="52" rx="8" fill="#eedefe" stroke="#7f77dd"/>
<text x="400" y="2608" text-anchor="middle" font-size="12" font-weight="700" fill="#3c3489">Req 6: Secure payment</text>
<text x="400" y="2626" text-anchor="middle" font-size="11" fill="#534ab7">PCI-DSS compliant. Card data never stored — tokenised by Razorpay/Stripe. HTTPS/TLS everywhere. Idempotency key prevents double charge. Txn recorded INITIATED before gateway call. Webhook HMAC verified.</text>

<rect x="30" y="2652" width="740" height="52" rx="8" fill="#faece7" stroke="#993c1d"/>
<text x="400" y="2672" text-anchor="middle" font-size="12" font-weight="700" fill="#712b13">Req 7: Email + SMS confirmations</text>
<text x="400" y="2690" text-anchor="middle" font-size="11" fill="#993c1d">Kafka consumer: booking-confirmed → Email Service (SendGrid/SES) + SMS Service (Twilio). PDF ticket + QR code generated async. Decoupled from booking — failure in email never fails the booking itself.</text>

<rect x="30" y="2716" width="740" height="52" rx="8" fill="#e1f5ee" stroke="#0f6e56"/>
<text x="400" y="2736" text-anchor="middle" font-size="12" font-weight="700" fill="#085041">Req 8: Waitlist for sold-out concerts</text>
<text x="400" y="2754" text-anchor="middle" font-size="11" fill="#0f6e56">Redis ZSET queue per concert. On cancellation: Kafka booking-cancelled → Waitlist Service dequeues next user → 15-min exclusive lock granted → Email+SMS notify → if expired, next in queue gets chance.</text>

<!-- FINAL BOX -->
<rect x="30" y="2788" width="740" height="60" rx="8" fill="#2c2c2a"/>
<text x="400" y="2810" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">The hardest problem in concert booking: 50,000 users all hitting "Buy" at 10:00:00 AM for Coldplay tickets.</text>
<text x="400" y="2830" text-anchor="middle" font-size="11" fill="#aaa">Solution: virtual queue (Redis ZSET) + per-seat atomic lock (SET NX) + all-or-nothing batch + TTL auto-release.</text>
